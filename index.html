<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verde Lab — Project Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F6F8;
    --sidebar: #FFFFFF;
    --card: #FFFFFF;
    --line: #E7E8EC;
    --ink: #1B1D23;
    --ink-dim: #6B6F7A;
    --ink-faint: #9AA0AC;
    --accent: #5B5BD6;
    --accent-light: #EEEEFB;
    --accent-dark: #3F3FB0;
    --green: #1F9D6B;
    --green-bg: #E5F7EF;
    --amber: #B6790A;
    --amber-bg: #FDF2DF;
    --red: #C4432E;
    --red-bg: #FBEAE6;
    --gray-bg: #F0F1F3;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter', sans-serif;display:flex;min-height:100vh;}
  .sidebar{
    width:240px;background:#fff;border-right:0.5px solid var(--border);
    padding:0;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;
    display:flex;flex-direction:column;min-width:180px;max-width:420px;
    font-family:'Inter',sans-serif;
  }
  .sidebar-resize-handle{
    position:absolute;top:0;right:-4px;bottom:0;width:8px;
    cursor:col-resize;z-index:10;background:transparent;
  }
  .sidebar-resize-handle:hover,.sidebar-resize-handle.dragging{background:var(--bg-accent);opacity:0.4;}
  .sidebar-inner{flex:1;padding:4px 0 20px;overflow-y:auto;}
  .brand-block{
    padding:13px 14px 11px;border-bottom:0.5px solid var(--border);
    display:flex;align-items:center;gap:9px;flex-shrink:0;
  }
  .brand-icon{
    width:28px;height:28px;background:linear-gradient(135deg,#4338CA,#818CF8);
    border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .brand-icon i{color:#fff;font-size:14px;}
  .brand{font-family:'Manrope',sans-serif;font-weight:700;font-size:13.5px;letter-spacing:-0.01em;color:var(--text-primary);line-height:1.2;}
  .brand-sub{font-size:10px;color:var(--text-muted);margin-top:1px;}
  .nav-group-label{
    font-size:9.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;
    letter-spacing:0.09em;padding:14px 14px 4px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .nav-item{
    display:flex;align-items:center;
    padding:0;cursor:pointer;position:relative;
    border-left:2px solid transparent;transition:background 0.08s;
  }
  .nav-item-inner{
    display:flex;align-items:center;gap:9px;
    padding:8px 12px 8px 12px;flex:1;min-width:0;
  }
  .nav-item-icon{
    font-size:15px;color:var(--text-muted);flex-shrink:0;
    width:18px;text-align:center;display:flex;align-items:center;justify-content:center;
    transition:color 0.08s;
  }
  .nav-item:hover{background:var(--surface-1);}
  .nav-item.active{background:#EEF2FF;border-left-color:#4338CA;}
  .nav-item.active .nav-item-icon{color:#4338CA;}
  .nav-label-text{
    flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-size:13px;font-weight:400;color:var(--text-secondary);transition:color 0.08s;
  }
  .nav-item.active .nav-label-text{color:#4338CA;font-weight:600;}
  .nav-item:hover:not(.active) .nav-label-text{color:#111;}
  .nav-pct{font-size:10px;color:#BBBBBB;flex-shrink:0;padding-right:2px;}
  .nav-item.active .nav-pct{color:#8B7FCC;opacity:1;}
  .nav-add-btn{
    margin:10px 12px 0;padding:9px 12px;border-radius:7px;font-size:12.5px;
    font-weight:600;color:#fff;background:#4338CA;cursor:pointer;
    text-align:center;border:none;transition:background 0.1s;
    display:flex;align-items:center;justify-content:center;gap:6px;
  }
  .nav-add-btn:hover{background:#3730A3;}
  .nav-footer{
    padding:10px 14px;border-top:0.5px solid var(--border);
    display:flex;align-items:center;gap:9px;flex-shrink:0;
  }
  .nav-footer-avatar{
    width:26px;height:26px;border-radius:50%;background:var(--bg-accent);
    display:flex;align-items:center;justify-content:center;
    font-size:10px;font-weight:600;color:var(--text-accent);flex-shrink:0;
  }
  .nav-footer-email{font-size:11px;color:var(--text-muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nav-footer-out{background:none;border:1px solid #E5E7EB;color:#6B7280;cursor:pointer;padding:6px 8px;display:flex;border-radius:6px;gap:4px;font-size:11px;font-weight:500;align-items:center;}
  .nav-footer-out:hover{color:#DC2626;border-color:#FCA5A5;background:#FEF2F2;}
  .nav-ctx-menu{
    position:fixed;z-index:1000;background:#fff;
    border:1px solid #E5E7EB;border-radius:10px;
    padding:4px 0;min-width:170px;
    box-shadow:0 8px 24px rgba(0,0,0,0.14),0 2px 6px rgba(0,0,0,0.08);
  }
  .nav-ctx-item{
    display:flex;align-items:center;gap:9px;padding:8px 14px;
    font-size:13px;color:#374151;cursor:pointer;white-space:nowrap;
  }
  .nav-ctx-item i{font-size:15px;color:#9CA3AF;width:16px;text-align:center;flex-shrink:0;}
  .nav-ctx-item:hover{background:#F9FAFB;color:#111;}
  .nav-ctx-item:hover i{color:#4338CA;}
  .nav-ctx-item.danger{color:#DC2626;}
  .nav-ctx-item.danger i{color:#DC2626;}
  .nav-ctx-item.danger:hover{background:#FEF2F2;}
  .nav-ctx-sep{height:1px;background:#F3F4F6;margin:3px 0;}
  .brand-block:hover .brand-icon{opacity:0.8;}
  .brand-edit-hint{font-size:9px;color:#AAA;margin-top:1px;}
  @media (hover:none) and (pointer:coarse){.nav-add-btn{opacity:1;}}

  .swipe-wrap{position:relative;overflow:hidden;display:block;}
  .swipe-content{position:relative;background:#fff;transition:transform 0.18s ease;touch-action:pan-y;z-index:2;display:block;}
  .swipe-delete-btn{
    position:absolute;top:0;right:0;bottom:0;width:76px;
    background:#DC2626;color:#fff;border:none;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    font-size:10.5px;font-weight:600;z-index:1;transform:translateX(76px);
  }
  .swipe-delete-btn svg{display:block;}

  .undo-redo-float{
    position:fixed;bottom:18px;right:18px;z-index:80;
    display:flex;gap:4px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 4px 16px rgba(0,0,0,0.12);padding:5px;
  }
  .undo-redo-float button{
    height:38px;padding:0 12px;border:none;background:none;border-radius:9px;
    color:var(--ink-dim);cursor:pointer;display:flex;align-items:center;gap:6px;
    font-size:12.5px;font-weight:600;font-family:'Inter',sans-serif;
  }
  .undo-redo-float button:hover:not(:disabled){background:var(--accent-light);color:var(--accent-dark);}
  .undo-redo-float button:disabled{opacity:0.3;cursor:default;}

  .login-overlay{
    position:fixed;inset:0;z-index:200;background:var(--bg);
    display:none;align-items:center;justify-content:center;padding:20px;
  }
  .login-overlay.show{display:flex;}
  .login-card{
    background:var(--card);border:1px solid var(--line);border-radius:16px;
    padding:32px 28px;width:100%;max-width:380px;
    box-shadow:0 8px 32px rgba(0,0,0,0.08);
  }
  .login-brand{font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;margin-bottom:2px;}
  .login-sub{font-size:13px;color:var(--ink-faint);margin-bottom:24px;}
  .login-card input{
    width:100%;border:1px solid var(--line);border-radius:10px;
    padding:13px 14px;font-size:15px;font-family:'Inter',sans-serif;
    margin-bottom:10px;box-sizing:border-box;
  }
  .login-card input:focus{outline:none;border-color:var(--accent);}
  .login-primary{
    width:100%;background:var(--accent);color:#fff;border:none;border-radius:10px;
    padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;
    margin-top:6px;
  }
  .login-primary:hover{background:var(--accent-dark);}
  .login-secondary{
    width:100%;background:none;border:none;color:var(--accent-dark);
    padding:12px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;margin-top:4px;
  }
  .login-secondary:hover{text-decoration:underline;}
  .login-note{font-size:12px;color:var(--ink-faint);text-align:center;margin-top:8px;line-height:1.5;}
  .login-error{
    display:none;background:var(--red-bg);color:var(--red);border-radius:8px;
    padding:10px 12px;font-size:12.5px;margin-bottom:14px;line-height:1.4;
  }
  .login-error.show{display:block;}

  .sync-status{
    position:fixed;bottom:18px;left:18px;z-index:80;
    font-size:11.5px;padding:7px 13px;border-radius:20px;
    background:var(--card);border:1px solid var(--line);color:var(--ink-faint);
    display:none;align-items:center;gap:6px;
    box-shadow:0 2px 8px rgba(0,0,0,0.06);
  }
  .sync-status.show{display:flex;}
  .sync-status.saving{color:var(--amber);}
  .sync-status.saved{color:var(--green);}
  .sync-status.error{color:var(--red);border-color:var(--red);}
  .sync-status.offline{color:var(--ink-dim);}

  .mobile-manage-overlay{
    display:none;position:fixed;inset:0;z-index:90;background:var(--bg);
    flex-direction:column;
  }
  .mobile-manage-overlay.open{display:flex;}
  .mobile-manage-header{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px 18px;border-bottom:1px solid var(--line);
    font-family:'Manrope',sans-serif;font-weight:700;font-size:17px;
    background:var(--sidebar);
  }
  .mobile-manage-header button{background:none;border:none;color:var(--ink-dim);padding:8px;display:flex;}
  #mobile-manage-list{flex:1;overflow-y:auto;padding:8px 0 90px;}
  .mm-group-label{
    font-size:11.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;
    letter-spacing:0.05em;padding:18px 18px 8px;display:flex;justify-content:space-between;align-items:center;
  }
  .mm-group-more{background:none;border:none;color:var(--ink-faint);padding:8px;display:flex;}
  .mm-row{
    display:flex;align-items:center;gap:12px;
    padding:14px 18px;border-bottom:1px solid var(--line);
    background:var(--card);
  }
  .mm-row-label{flex:1;font-size:15px;font-weight:500;}
  .mm-row-pct{font-size:13px;color:var(--ink-faint);}
  .mm-row-more{
    background:none;border:none;color:var(--ink-dim);
    width:40px;height:40px;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  #mobile-manage-add{
    position:fixed;left:16px;right:16px;bottom:16px;z-index:91;
    background:var(--accent);color:#fff;border:none;border-radius:12px;
    padding:15px;font-size:15px;font-weight:600;
  }
  .action-sheet-overlay{
    position:fixed;inset:0;z-index:110;background:rgba(20,20,25,0.45);
    display:flex;align-items:flex-end;
  }
  .action-sheet{
    background:var(--card);width:100%;border-radius:16px 16px 0 0;
    padding:8px 0 max(16px, env(safe-area-inset-bottom));
  }
  .action-sheet-title{
    font-size:13px;color:var(--ink-faint);padding:12px 20px 8px;font-weight:600;
  }
  .action-sheet button{
    display:block;width:100%;text-align:left;background:none;border:none;
    padding:15px 20px;font-size:15.5px;color:var(--ink);
  }
  .action-sheet button.danger{color:var(--red);}
  .action-sheet button:active{background:var(--gray-bg);}
  .action-sheet .as-cancel{border-top:1px solid var(--line);margin-top:6px;color:var(--ink-dim);font-weight:600;}
  .nav-item.dragging{opacity:0.4;}
  .nav-item.drag-over{background:var(--accent-light);box-shadow:inset 0 2px 0 var(--accent);}
  .nav-group-label.drag-over-label{color:var(--accent-dark);}
  .main{flex:1;padding:32px 40px 60px;max-width:960px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;}
  .page-head h1{font-family:'Manrope', sans-serif;font-weight:700;font-size:23px;margin:0 0 4px;}
  .page-head .sub{font-size:13px;color:var(--ink-dim);}
  .view{display:none;}
  .view.active{display:block;}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
  .kpi-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .kpi-label{font-size:12px;color:var(--ink-dim);margin-bottom:6px;}
  .kpi-value{font-family:'Manrope', sans-serif;font-weight:700;font-size:26px;}
  .kpi-value.accent{color:var(--accent-dark);}
  .kpi-value.red{color:var(--red);}

  .section-label{font-size:12.5px;font-weight:600;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.04em;margin:28px 0 12px;}
  .topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .topic-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color 0.15s ease;}
  .topic-card:hover{border-color:var(--accent);}
  .topic-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;}
  .topic-card-top h3{font-size:13.5px;font-weight:600;margin:0;}
  .topic-card-top .count{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;}
  .bar-track{height:6px;background:var(--gray-bg);border-radius:3px;overflow:hidden;margin-bottom:8px;}
  .bar-fill{height:100%;background:var(--accent);border-radius:3px;}
  .topic-card-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-faint);}
  .flag-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13px;}
  .flag-row .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .flag-row .dot.high{background:var(--red);}
  .flag-row .dot.blocked{background:var(--amber);}
  .flag-row .topic-tag{margin-left:auto;font-size:11px;color:var(--ink-faint);background:var(--gray-bg);padding:2px 8px;border-radius:8px;white-space:nowrap;}

  :root{
    --group-foundations: var(--accent);
    --group-product: var(--amber);
    --group-gtm: #0E7C86;
    --group-operations: var(--green);
  }
  .ops-search-wrap{display:flex;flex-direction:column;gap:8px;margin-bottom:10px;}
  #ops-search-input{
    width:100%;border:1px solid var(--line);border-radius:10px;
    padding:11px 14px;font-size:14px;font-family:'Inter',sans-serif;
    background:var(--card);color:var(--ink);box-sizing:border-box;
  }
  #ops-search-input:focus{outline:none;border-color:var(--accent);}
  .ops-sort-controls{display:flex;gap:6px;}
  .ops-sort-controls button{
    background:none;border:1px solid var(--line);color:var(--ink-dim);
    font-family:'Inter',sans-serif;font-size:11px;text-transform:uppercase;
    letter-spacing:0.03em;padding:5px 10px;border-radius:8px;cursor:pointer;
  }
  .ops-sort-controls button.active{border-color:var(--accent);color:var(--accent-dark);background:var(--accent-light);}
  #ops-search-results .task-card{cursor:pointer;}
  #ops-search-results .task-card:hover{border-color:var(--accent);}
  .search-empty{font-size:13px;color:var(--ink-faint);padding:14px 0;}

  .ops-cal-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
  .ops-cal-range{font-size:11.5px;color:var(--ink-faint);font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:0.04em;}
  .ops-cal-nav button{
    background:var(--card);border:1px solid var(--line);color:var(--ink);
    font-family:'Inter',sans-serif;font-size:12.5px;padding:6px 13px;border-radius:8px;cursor:pointer;
  }
  .ops-cal-nav button:hover{border-color:var(--accent);}
  .ops-cal-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:8px;}
  .ops-month{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;}
  .ops-month-title{font-family:'Manrope',sans-serif;font-weight:700;font-size:14.5px;margin-bottom:10px;}
  .ops-weekday-row{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:4px;}
  .ops-weekday-row div{font-size:10px;color:var(--ink-faint);text-align:center;}
  .ops-day-grid{display:grid;grid-template-columns:repeat(7,1fr);grid-auto-rows:minmax(52px,auto);gap:3px;}
  .ops-day-cell{background:var(--gray-bg);border:1px solid transparent;border-radius:6px;padding:4px 5px;font-size:11px;color:var(--ink-dim);min-height:52px;overflow:hidden;}
  .ops-day-cell.other-month{opacity:0.35;}
  .ops-day-cell.today{border-color:var(--accent);}
  .ops-day-num{font-weight:600;margin-bottom:2px;font-size:11px;}
  .ops-day-chip{
    display:flex;align-items:center;gap:4px;font-size:10px;color:var(--ink);
    line-height:1.3;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    cursor:pointer;border-radius:4px;padding:1px 3px;
  }
  .ops-day-chip:hover{background:#fff;}
  .ops-day-dot{width:6px;height:6px;border-radius:50%;flex:0 0 auto;}
  .ops-day-more{font-size:9.5px;color:var(--ink-faint);}
  .task-flash{animation:opsFlash 1.4s ease;}
  @keyframes opsFlash{
    0%{box-shadow:0 0 0 2px var(--accent);}
    100%{box-shadow:0 0 0 0 transparent;}
  }

  .task-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;}
  .task-check{width:18px;height:18px;border-radius:6px;border:1.5px solid #C7C9D1;background:#fff;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;padding:0;}
  .task-check.done{background:var(--green);border-color:var(--green);}
  .task-check.done::after{content:'\2713';color:#fff;font-size:11px;}
  .task-body{flex:1;min-width:0;}
  .task-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .task-text{font-size:14px;cursor:pointer;}
  .task-text.done{color:var(--ink-faint);text-decoration:line-through;}
  .pill{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:8px;letter-spacing:0.02em;}
  .pill.high{background:var(--red-bg);color:var(--red);}
  .pill.medium{background:var(--amber-bg);color:var(--amber);}
  .pill.low{background:var(--gray-bg);color:var(--ink-dim);}
  select.priority-select{font-size:10.5px;font-weight:600;border:none;border-radius:8px;padding:2px 8px;font-family:'Inter',sans-serif;cursor:pointer;letter-spacing:0.02em;}
  .priority-select.high{background:var(--red-bg);color:var(--red);}
  .priority-select.medium{background:var(--amber-bg);color:var(--amber);}
  .priority-select.low{background:var(--gray-bg);color:var(--ink-dim);}
  select.status-select{font-size:11px;font-weight:600;border:none;border-radius:8px;padding:3px 8px;font-family:'Inter',sans-serif;cursor:pointer;}
  .status-select.not_started{background:var(--gray-bg);color:var(--ink-dim);}
  .status-select.in_progress{background:var(--amber-bg);color:var(--amber);}
  .status-select.done{background:var(--green-bg);color:var(--green);}
  .status-select.blocked{background:var(--red-bg);color:var(--red);}
  .icon-btn{background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:3px;opacity:0.6;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;}
  .icon-btn:hover{opacity:1;color:var(--accent);background:var(--accent-light);}
  .icon-btn svg{display:block;}
  .task-del{background:none;border:1px solid var(--line);color:var(--ink-faint);cursor:pointer;font-size:12px;padding:4px 9px;border-radius:8px;opacity:0.7;white-space:nowrap;}
  .task-del:hover{opacity:1;color:var(--red);border-color:var(--red-bg);background:var(--red-bg);}
  .task-comment{font-size:12.5px;color:var(--ink-dim);margin-top:6px;}
  .comment-input{width:100%;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:'Inter',sans-serif;padding:6px 8px;margin-top:6px;min-height:32px;}
  .attach-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center;}
  .thumb-wrap{position:relative;width:36px;height:36px;flex-shrink:0;}

let history = [];
const MAX_HISTORY = 8;

async function loadHistory(){
  try{
    if(window.storage){
      const res = await window.storage.get('virt-tracker-history');
      if(res && res.value) return JSON.parse(res.value);
    }
  }catch(e){}
  try{
    const local = localStorage.getItem('virt-tracker-history');
    if(local) return JSON.parse(local);
  }catch(e){}
  return [];
}

async function saveHistory(){
  const payload = JSON.stringify(history);
  try{
    if(window.storage){ await window.storage.set('virt-tracker-history', payload); return; }
  }catch(e){}
  try{ localStorage.setItem('virt-tracker-history', payload); }
  catch(e){
    // storage quota likely hit (large images) - drop oldest half and retry once
    history = history.slice(0, Math.ceil(history.length/2));
    try{ localStorage.setItem('virt-tracker-history', JSON.stringify(history)); }catch(e2){ /* give up silently */ }
  }
}

function snapshotBeforeChange(note){
  history.unshift({
    ts: new Date().toISOString(),
    note: note,
    snapshot: JSON.stringify({tasks, formulaRows, topics: TOPICS})
  });
  if(history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
  saveHistory();
}

function fmtTs(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) + ' ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

function getLastExport(){
  try{ return localStorage.getItem('virt-last-export'); }catch(e){ return null; }
}
function setLastExport(){
  try{ localStorage.setItem('virt-last-export', new Date().toISOString()); }catch(e){}
}

function renderExportReminder(){
  const slot = document.getElementById('export-reminder-slot');
  if(!slot) return;
  const last = getLastExport();
  slot.innerHTML = '';
  const banner = document.createElement('div');
  banner.className = 'export-reminder';
  const label = last ? `Last backup export: ${fmtTs(last)}` : 'No backup exported yet — your data only lives in this browser.';
  banner.innerHTML = `<span>${label}</span>`;
  const btn = document.createElement('button');
  btn.textContent = 'Export now';
  btn.addEventListener('click', ()=>document.getElementById('export-btn').click());
  banner.appendChild(btn);
  slot.appendChild(banner);
}

function openHistoryModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) root.innerHTML=''; });
  const box = document.createElement('div');
  box.className = 'history-modal';
  box.innerHTML = `
    <h3>Version history</h3>
    <div class="sub">Automatic snapshots taken right before each deletion. Restoring is itself undoable.</div>
  `;
  if(!history.length){
    box.innerHTML += '<div class="history-empty">No snapshots yet — one is taken automatically the first time you delete something.</div>';
  } else {
    history.forEach((h, idx)=>{
      const row = document.createElement('div');
      row.className = 'history-row';
      row.innerHTML = `<span class="history-meta">${fmtTs(h.ts)} — ${h.note}</span>`;
      const btn = document.createElement('button');
      btn.className = 'history-restore';
      btn.textContent = 'Restore';
      btn.addEventListener('click', ()=>{
        if(!confirm('Restore this version? Your current state will itself be saved as a snapshot first, so this is reversible.')) return;
        snapshotBeforeChange('before restoring a previous version');
        const restored = JSON.parse(h.snapshot);
        tasks = restored.tasks;
        formulaRows = restored.formulaRows || [];
        TOPICS = (restored.topics && restored.topics.length) ? restored.topics : TOPICS;
        nextTaskId = Math.max(0, ...tasks.map(t=>t.id||0)) + 1;
        nextFormulaId = Math.max(0, ...formulaRows.map(r=>r.id||0)) + 1;
        nextCustomTopicId = 1;
        TOPICS.forEach(t=>{
          const m = /^custom(\d+)$/.exec(t.key);
          if(m) nextCustomTopicId = Math.max(nextCustomTopicId, Number(m[1])+1);
        });
        saveStorage();
        root.innerHTML = '';
        renderOverview(); renderTopicViews(); switchView('overview');
      });
      row.appendChild(btn);
      box.appendChild(row);
    });
  }
  overlay.appendChild(box);
  root.appendChild(overlay);
}

let undoStack = [];
let redoStack = [];
let lastSavedSnapshot = null;
const MAX_UNDO = 30;

let cloudSaveTimer = null;
let pendingPayload = null;

async function persistRaw(payload){
  // Local cache first, so nothing is ever lost if the network is down.
  try{ localStorage.setItem('virt-full-tracker', payload); }catch(e){}
  if(!currentUser) return;
  pendingPayload = payload;
  setSyncStatus('saving');
  if(cloudSaveTimer) clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(async ()=>{
    const toSave = pendingPayload;
    try{
      await fbDb.collection('trackers').doc(currentUser.uid).set({payload: toSave, updatedAt: Date.now()});
      setSyncStatus('saved');
    }catch(e){
      setSyncStatus('error');
    }
  }, 600);
}

async function saveStorage(){
  const payload = JSON.stringify({tasks, formulaRows, topics: TOPICS});
  if(lastSavedSnapshot !== null && lastSavedSnapshot !== payload){
    undoStack.push(lastSavedSnapshot);
    if(undoStack.length > MAX_UNDO) undoStack.shift();
    redoStack = [];
  }
  lastSavedSnapshot = payload;
  updateUndoRedoButtons();
  await persistRaw(payload);
}

function recalcNextIds(){
  nextTaskId = Math.max(0, ...tasks.map(t=>t.id||0)) + 1;
  nextFormulaId = Math.max(0, ...formulaRows.map(r=>r.id||0)) + 1;
  nextCustomTopicId = 1;
  TOPICS.forEach(t=>{
    const m = /^custom(\d+)$/.exec(t.key);
    if(m) nextCustomTopicId = Math.max(nextCustomTopicId, Number(m[1])+1);
  });
}

function restoreFromSnapshotStr(str){
  const state = JSON.parse(str);
  tasks = state.tasks;
  formulaRows = state.formulaRows || [];
  TOPICS = (state.topics && state.topics.length) ? state.topics : TOPICS;
  recalcNextIds();
}

function performUndo(){
  if(!undoStack.length) return;
  const current = JSON.stringify({tasks, formulaRows, topics: TOPICS});
  redoStack.push(current);
  const prev = undoStack.pop();
  restoreFromSnapshotStr(prev);
  lastSavedSnapshot = prev;
  persistRaw(prev);
  updateUndoRedoButtons();
  renderOverview(); renderTopicViews();
  const activeView = document.querySelector('.view.active');
  switchView(activeView ? activeView.id.replace('view-','') : 'overview');
}

function performRedo(){
  if(!redoStack.length) return;
  const current = JSON.stringify({tasks, formulaRows, topics: TOPICS});
  undoStack.push(current);
  const next = redoStack.pop();
  restoreFromSnapshotStr(next);
  lastSavedSnapshot = next;
  persistRaw(next);
  updateUndoRedoButtons();
  renderOverview(); renderTopicViews();
  const activeView = document.querySelector('.view.active');
  switchView(activeView ? activeView.id.replace('view-','') : 'overview');
}

function updateUndoRedoButtons(){
  const undoBtn = document.getElementById('undo-btn');
  const redoBtn = document.getElementById('redo-btn');
  if(undoBtn) undoBtn.disabled = undoStack.length === 0;
  if(redoBtn) redoBtn.disabled = redoStack.length === 0;
}

function topicStats(key){
  const t = tasks.filter(x=>x.topic===key);
  const done = t.filter(x=>x.status==='done').length;
  return {total:t.length, done, pct: t.length? Math.round(done/t.length*100):0};
}

let draggedTopicKey = null;

function reorderTopics(draggedKey, targetKey, targetGroup){
  const draggedIdx = TOPICS.findIndex(t=>t.key===draggedKey);
  if(draggedIdx === -1) return;
  const [draggedTopic] = TOPICS.splice(draggedIdx, 1);
  draggedTopic.group = targetGroup;
  if(targetKey){
    const targetIdx = TOPICS.findIndex(t=>t.key===targetKey);
    if(targetIdx === -1){ TOPICS.push(draggedTopic); }
    else { TOPICS.splice(targetIdx, 0, draggedTopic); }
  } else {
    // dropped on a group label: place at the end of that group's block
    let lastIdx = -1;
    TOPICS.forEach((t,i)=>{ if(t.group===targetGroup) lastIdx = i; });
    if(lastIdx === -1){ TOPICS.push(draggedTopic); }
    else { TOPICS.splice(lastIdx+1, 0, draggedTopic); }
  }
  saveStorage();
}

function attachSwipeToDelete(wrapEl, contentEl, onDelete){
  let startX = 0, currentX = 0, dragging = false, opened = false;
  const REVEAL = 76;

  function closeAllOthers(){
    document.querySelectorAll('.swipe-content.swiped-open').forEach(el=>{
      if(el !== contentEl){ el.classList.remove('swiped-open'); el.style.transform = ''; }
    });
  }

  contentEl.addEventListener('touchstart', (e)=>{
    startX = e.touches[0].clientX;
    dragging = true;
  }, {passive:true});

  contentEl.addEventListener('touchmove', (e)=>{
    if(!dragging) return;
    currentX = e.touches[0].clientX - startX;
    if(opened) currentX -= REVEAL;
    if(currentX > 0) currentX = 0;
    if(currentX < -REVEAL) currentX = -REVEAL;
    contentEl.style.transform = `translateX(${currentX}px)`;
  }, {passive:true});

  contentEl.addEventListener('touchend', ()=>{
    dragging = false;
    if(currentX < -REVEAL/2){
      contentEl.style.transform = `translateX(-${REVEAL}px)`;
      contentEl.classList.add('swiped-open');
      opened = true;
      closeAllOthers();
    } else {
      contentEl.style.transform = '';
      contentEl.classList.remove('swiped-open');
      opened = false;
    }
    currentX = 0;
  });

  const delBg = document.createElement('button');
  delBg.className = 'swipe-delete-btn';
  delBg.innerHTML = icon('trash') + '<span>Delete</span>';
  delBg.addEventListener('click', (e)=>{
    e.stopPropagation();
    contentEl.style.transform = '';
    contentEl.classList.remove('swiped-open');
    onDelete();
  });
  wrapEl.appendChild(delBg);
}

function moveTopicInGroup(key, direction){
  const topic = TOPICS.find(t=>t.key===key);
  if(!topic) return;
  const group = topic.group;
  const groupIndices = [];
  TOPICS.forEach((t,i)=>{ if(t.group===group) groupIndices.push(i); });
  const idxA = TOPICS.findIndex(t=>t.key===key);
  const posInGroup = groupIndices.indexOf(idxA);
  const targetPos = posInGroup + direction;
  if(targetPos < 0 || targetPos >= groupIndices.length) return;
  const idxB = groupIndices[targetPos];
  const tmp = TOPICS[idxA];
  TOPICS[idxA] = TOPICS[idxB];
  TOPICS[idxB] = tmp;
  saveStorage();
}

let activeCtxMenu = null;

function openCtxMenu(e, items){
  e.preventDefault(); e.stopPropagation();
  closeCtxMenu();
  const menu = document.createElement('div');
  menu.className = 'nav-ctx-menu';
  items.forEach(item=>{
    if(item==='sep'){ const s=document.createElement('div'); s.className='nav-ctx-sep'; menu.appendChild(s); return; }
    const el = document.createElement('div');
    el.className = 'nav-ctx-item' + (item.danger?' danger':'');
    el.innerHTML = `<i class="ti ${item.icon}" aria-hidden="true"></i>${item.label}`;
    el.addEventListener('click', (ev)=>{ ev.stopPropagation(); closeCtxMenu(); item.onClick(); });
    menu.appendChild(el);
  });
  document.body.appendChild(menu);
  const vw=window.innerWidth, vh=window.innerHeight, mx=e.clientX, my=e.clientY;
  const mw=menu.offsetWidth, mh=menu.offsetHeight;
  menu.style.left = (mx+mw>vw ? mx-mw : mx)+'px';
  menu.style.top  = (my+mh>vh ? my-mh : my)+'px';
  activeCtxMenu = menu;
}

function renderNav(activeKey){
  const nav = document.getElementById('nav');

  overviewItem.innerHTML = `<div class="nav-item-inner"><i class="ti ti-layout-dashboard nav-item-icon" aria-hidden="true"></i><span class="nav-label-text">Overview</span></div>`;
  overviewItem.addEventListener('click', ()=>switchView('overview'));
  nav.appendChild(overviewItem);

  const groupOrder = [];
  TOPICS.forEach(t=>{ if(!groupOrder.includes(t.group)) groupOrder.push(t.group); });

  groupOrder.forEach(group=>{
    const glWrap = document.createElement('div');
    glWrap.className = 'swipe-wrap';
    const gl = document.createElement('div');
    gl.className = 'nav-group-label swipe-content';
    gl.innerHTML = `<span>${group}</span>`;
    gl.addEventListener('contextmenu', (e)=>{
      openCtxMenu(e,[
        {icon:'ti-copy',label:'Duplicate theme',onClick:()=>{ if(confirm('Duplicate "'+group+'" with all its master tasks?')) duplicateTheme(group); }},
        'sep',
        {icon:'ti-trash',label:'Delete theme',danger:true,onClick:()=>deleteTheme(group)}
      ]);
    });
    gl.addEventListener('dragover', (e)=>{ e.preventDefault(); if(draggedTopicKey) gl.classList.add('drag-over-label'); });
    gl.addEventListener('dragleave', ()=>gl.classList.remove('drag-over-label'));
    gl.addEventListener('drop', (e)=>{
      e.preventDefault(); gl.classList.remove('drag-over-label');
      if(!draggedTopicKey) return;
      reorderTopics(draggedTopicKey, null, group); draggedTopicKey=null; renderNav(activeKey);
    });
    glWrap.appendChild(gl);
    attachSwipeToDelete(glWrap, gl, ()=>deleteTheme(group));
    nav.appendChild(glWrap);

    TOPICS.filter(t=>t.group===group).forEach(topic=>{
      const stats = topicStats(topic.key);
      const iCls = topic.icon || topicIcon(topic.key, topic.label);
      const itemWrap = document.createElement('div');
      itemWrap.className = 'swipe-wrap';
      const item = document.createElement('div');
      item.className = 'nav-item swipe-content'+(activeKey===topic.key?' active':'');
      item.setAttribute('draggable','true');
      item.innerHTML = `<div class="nav-item-inner"><i class="ti ${iCls} nav-item-icon" aria-hidden="true"></i><span class="nav-label-text">${topic.label}</span><span class="nav-pct">${stats.pct}%</span></div>`;
      item.addEventListener('click', (e)=>{
        if(item.classList.contains('swiped-open')){ item.style.transform=''; item.classList.remove('swiped-open'); return; }
        switchView(topic.key);
      });
      item.addEventListener('contextmenu', (e)=>{
        openCtxMenu(e,[
          {icon:'ti-arrow-right',label:'Open',onClick:()=>switchView(topic.key)},
          {icon:'ti-copy',label:'Duplicate',onClick:()=>duplicateMasterTask(topic.key)},
          'sep',
          {icon:'ti-arrow-up',label:'Move up',onClick:()=>{ moveTopicInGroup(topic.key,-1); renderNav(activeKey); }},
          {icon:'ti-arrow-down',label:'Move down',onClick:()=>{ moveTopicInGroup(topic.key,1); renderNav(activeKey); }},
          'sep',
          {icon:'ti-trash',label:'Delete',danger:true,onClick:()=>deleteMasterTaskByKey(topic.key)}
        ]);
      });
      item.addEventListener('dragstart', (e)=>{
        draggedTopicKey=topic.key;
        try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',topic.key); }catch(err){}
        item.classList.add('dragging');
      });
      item.addEventListener('dragend', ()=>{
        item.classList.remove('dragging');
        document.querySelectorAll('.nav-item.drag-over,.nav-group-label.drag-over-label').forEach(el=>el.classList.remove('drag-over','drag-over-label'));
        draggedTopicKey=null;
      });
      item.addEventListener('dragover', (e)=>{
        e.preventDefault();
        if(draggedTopicKey && draggedTopicKey!==topic.key) item.classList.add('drag-over');
      });
      item.addEventListener('dragleave', ()=>item.classList.remove('drag-over'));
      item.addEventListener('drop', (e)=>{
        e.preventDefault(); item.classList.remove('drag-over');
        if(!draggedTopicKey||draggedTopicKey===topic.key) return;
        reorderTopics(draggedTopicKey,topic.key,topic.group); draggedTopicKey=null; renderNav(activeKey);
      });
      itemWrap.appendChild(item);
      attachSwipeToDelete(itemWrap, item, ()=>deleteMasterTaskByKey(topic.key));
      nav.appendChild(itemWrap);
    });
  });

  const addBtn = document.createElement('div');
  addBtn.className = 'nav-add-btn';
  addBtn.innerHTML = '<i class="ti ti-plus" aria-hidden="true" style="font-size:12px;"></i> Add master task';
  addBtn.addEventListener('click', openAddMasterTaskModal);
  nav.appendChild(addBtn);

  renderMobileManage();
}

function slugify(str){
  return str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/(^-|-$)/g,'');
}



function switchView(key){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  if(key==='overview'){ document.getElementById('overview').classList.add('active'); }
  else { document.getElementById('view-'+key).classList.add('active'); }
  renderNav(key);
}

function renderOverview(){
  const allDone = tasks.filter(t=>t.status==='done').length;
  const allTotal = tasks.length;
  const blocked = tasks.filter(t=>t.status==='blocked').length;
  const highOpen = tasks.filter(t=>t.priority==='high' && t.status!=='done').length;

  document.getElementById('kpi-row').innerHTML = `
    <div class="kpi-card"><div class="kpi-label">Overall complete</div><div class="kpi-value accent">${allTotal? Math.round(allDone/allTotal*100):0}%</div></div>
    <div class="kpi-card"><div class="kpi-label">Open tasks</div><div class="kpi-value">${allTotal-allDone}</div></div>
    <div class="kpi-card"><div class="kpi-label">High priority open</div><div class="kpi-value">${highOpen}</div></div>
    <div class="kpi-card"><div class="kpi-label">Blocked</div><div class="kpi-value red">${blocked}</div></div>
  `;

  const flagList = document.getElementById('flag-list');
  const flags = tasks.filter(t=>t.status==='blocked' || (t.priority==='high' && t.status!=='done'));
  flagList.innerHTML = flags.length ? '' : '<div class="empty-note">Nothing flagged.</div>';
  flags.forEach(t=>{
    const topicLabel = TOPICS.find(x=>x.key===t.topic).label;
    const row = document.createElement('div');
    row.className = 'flag-row';
    row.innerHTML = `<span class="dot ${t.status==='blocked'?'blocked':'high'}"></span>${t.text}<span class="topic-tag">${topicLabel}</span>`;
    flagList.appendChild(row);
  });

  const topicGrid = document.getElementById('topic-grid');
  topicGrid.innerHTML = '';
  TOPICS.forEach(topic=>{
    const stats = topicStats(topic.key);
    const card = document.createElement('div');
    card.className = 'topic-card';
    card.innerHTML = `
      <div class="topic-card-top"><h3>${topic.label}</h3><span class="count">${stats.done}/${stats.total}</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${stats.pct}%"></div></div>
      <div class="topic-card-foot"><span>${stats.pct}% complete</span><span>View &rarr;</span></div>
    `;
    card.addEventListener('click', ()=>switchView(topic.key));
    topicGrid.appendChild(card);
  });

  renderCalendarOverview();
  runOpsSearch();
}

/* ---------- Calendar (overview) ---------- */
const OPS_GROUP_COLORS = {
  'Foundations': 'var(--group-foundations)',
  'Product': 'var(--group-product)',
  'Go-to-market': 'var(--group-gtm)',
  'Operations': 'var(--group-operations)'
};
function opsGroupColor(topicKey){
  const topic = TOPICS.find(t=>t.key===topicKey);
  if(!topic) return 'var(--ink-faint)';
  return OPS_GROUP_COLORS[topic.group] || 'var(--ink-faint)';
}

let opsCalMonthOffset = 0;

function opsTodayIso(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}

function escapeOpsHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function opsBuildMonth(baseDate){
  const year = baseDate.getFullYear();
  const month = baseDate.getMonth();
  const first = new Date(year, month, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const today = opsTodayIso();

  const cells = [];
  for(let i=0;i<startDow;i++){ cells.push({day: daysInPrevMonth - startDow + 1 + i, other:true}); }
  for(let d=1; d<=daysInMonth; d++){
    cells.push({day:d, other:false, iso: year+'-'+String(month+1).padStart(2,'0')+'-'+String(d).padStart(2,'0')});
  }
  while(cells.length % 7 !== 0){ cells.push({day: cells.length, other:true}); }

  const monthLabel = first.toLocaleDateString('en-US',{month:'long', year:'numeric'});
  let html = '<div class="ops-month"><div class="ops-month-title">'+monthLabel+'</div>';
  html += '<div class="ops-weekday-row">'+['S','M','T','W','T','F','S'].map(d=>'<div>'+d+'</div>').join('')+'</div>';
  html += '<div class="ops-day-grid">';
  cells.forEach(c=>{
    if(c.other){ html += '<div class="ops-day-cell other-month"><div class="ops-day-num">'+c.day+'</div></div>'; return; }
    const isToday = c.iso === today;
    const dueTasks = tasks.filter(t=>t.dueDate===c.iso);
    let chips = dueTasks.slice(0,2).map(t=>{
      const color = opsGroupColor(t.topic);
      return '<div class="ops-day-chip" data-goto="'+t.id+'" title="'+escapeOpsHtml(t.text)+'"><span class="ops-day-dot" style="background:'+color+'"></span>'+escapeOpsHtml(t.text)+'</div>';
    }).join('');
    let more = dueTasks.length>2 ? '<div class="ops-day-more">+'+(dueTasks.length-2)+' more</div>' : '';
    html += '<div class="ops-day-cell'+(isToday?' today':'')+'"><div class="ops-day-num">'+c.day+'</div>'+chips+more+'</div>';
  });
  html += '</div></div>';
  return html;
}

function renderCalendarOverview(){
  const grid = document.getElementById('ops-cal-grid');
  if(!grid) return;
  const now = new Date();
  const base = new Date(now.getFullYear(), now.getMonth() + opsCalMonthOffset, 1);
  const next = new Date(now.getFullYear(), now.getMonth() + opsCalMonthOffset + 1, 1);
  grid.innerHTML = opsBuildMonth(base) + opsBuildMonth(next);
  const rangeLabel = document.getElementById('ops-cal-range');
  if(rangeLabel){
    rangeLabel.textContent =
      base.toLocaleDateString('en-US',{month:'short',year:'numeric'}) + ' – ' +
      next.toLocaleDateString('en-US',{month:'short',year:'numeric'});
  }
  grid.querySelectorAll('[data-goto]').forEach(el=>{
    el.addEventListener('click', ()=> goToTask(Number(el.getAttribute('data-goto'))));
  });
}

/* ---------- Go to a task and open it for editing ---------- */
function goToTask(taskId){
  const task = tasks.find(t=>t.id===taskId);
  if(!task) return;
  task._expanded = true;
  switchView(task.topic);
  renderTaskList(task.topic);
  requestAnimationFrame(()=>{
    const card = document.querySelector('#tasklist-'+task.topic+' .task-card[data-id="'+task.id+'"]');
    if(card){
      card.scrollIntoView({behavior:'smooth', block:'center'});
      card.classList.add('task-flash');
      setTimeout(()=>card.classList.remove('task-flash'), 1400);
    }
  });
}

/* ---------- Search ---------- */
let opsSearchSortMode = 'date';

function opsRelevance(task, words){
  const title = task.text.toLowerCase();
  const comment = (task.comment||'').toLowerCase();
  const topicLabel = (TOPICS.find(t=>t.key===task.topic)||{label:''}).label.toLowerCase();
  let score = 0;
  words.forEach(w=>{
    if(!w) return;
    score += (title.split(w).length-1)*3;
    score += (comment.split(w).length-1)*1;
    score += (topicLabel.split(w).length-1)*2;
    if(title.startsWith(w)) score += 2;
  });
  return score;
}

function runOpsSearch(){
  const input = document.getElementById('ops-search-input');
  const resultsEl = document.getElementById('ops-search-results');
  const sortControls = document.getElementById('ops-sort-controls');
  if(!input || !resultsEl) return;
  const q = input.value.trim().toLowerCase();

  if(!q){
    resultsEl.innerHTML = '';
    if(sortControls) sortControls.hidden = true;
    return;
  }
  if(sortControls) sortControls.hidden = false;

  const words = q.split(/\s+/).filter(Boolean);
  let matches = tasks.filter(t=>{
    const topicLabel = (TOPICS.find(x=>x.key===t.topic)||{label:''}).label.toLowerCase();
    const combined = (t.text+' '+(t.comment||'')+' '+topicLabel).toLowerCase();
    return words.every(w=>combined.includes(w));
  });

  if(opsSearchSortMode==='date'){
    matches.sort((a,b)=> (a.dueDate||'9999-99-99').localeCompare(b.dueDate||'9999-99-99'));
  } else if(opsSearchSortMode==='newest'){
    matches.sort((a,b)=> (b.dueDate||'0000-00-00').localeCompare(a.dueDate||'0000-00-00'));
  } else {
    matches.sort((a,b)=> opsRelevance(b,words) - opsRelevance(a,words) || (a.dueDate||'9999-99-99').localeCompare(b.dueDate||'9999-99-99'));
  }

  if(matches.length===0){
    resultsEl.innerHTML = '<div class="search-empty">No tasks match "'+escapeOpsHtml(q)+'".</div>';
    return;
  }

  resultsEl.innerHTML = matches.map(t=>{
    const topic = TOPICS.find(x=>x.key===t.topic);
    const color = opsGroupColor(t.topic);
    const due = t.dueDate ? '<span class="due-badge">'+t.dueDate+'</span>' : '';
    return '<div class="task-card" data-goto-search="'+t.id+'">'
      + '<span class="ops-day-dot" style="background:'+color+';margin-top:6px;"></span>'
      + '<div class="task-body"><div class="task-top"><span class="task-text'+(t.status==='done'?' done':'')+'">'+escapeOpsHtml(t.text)+'</span>'+due+'</div>'
      + '<div style="font-size:11px;color:var(--ink-faint);margin-top:4px;">'+(topic?topic.label:'')+'</div></div>'
    + '</div>';
  }).join('');
  resultsEl.querySelectorAll('[data-goto-search]').forEach(el=>{
    el.addEventListener('click', ()=> goToTask(Number(el.getAttribute('data-goto-search'))));
  });
}

function fileToResizedDataUrl(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function deleteMasterTaskByKey(key){
  const topic = TOPICS.find(t=>t.key===key);
  if(!topic) return;
  const count = tasks.filter(t=>t.topic===key).length;
  if(!confirm('Delete "'+topic.label+'" and its '+count+' task(s)? A snapshot will be saved to Version history first, so this is recoverable.')) return;
  snapshotBeforeChange('before deleting master task: '+topic.label);
  tasks = tasks.filter(t=>t.topic!==key);
  TOPICS = TOPICS.filter(t=>t.key!==key);
  saveStorage();
  renderOverview();
  renderTopicViews();
  switchView('overview');
}

function deleteTheme(groupName){
  const topicsInGroup = TOPICS.filter(t=>t.group===groupName);
  const topicKeys = topicsInGroup.map(t=>t.key);
  const taskCount = tasks.filter(t=>topicKeys.includes(t.topic)).length;
  if(!confirm('Delete the theme "'+groupName+'" — '+topicsInGroup.length+' master task(s) and '+taskCount+' total task(s)? A snapshot will be saved to Version history first.')) return;
  snapshotBeforeChange('before deleting theme: '+groupName);
  tasks = tasks.filter(t=>!topicKeys.includes(t.topic));
  TOPICS = TOPICS.filter(t=>t.group!==groupName);
  saveStorage();
  renderOverview();
  renderTopicViews();
  switchView('overview');
}

function duplicateMasterTask(sourceKey){
  const source = TOPICS.find(t=>t.key===sourceKey);
  if(!source) return;
  snapshotBeforeChange('before duplicating master task: '+source.label);
  const newKey = 'custom' + (nextCustomTopicId++);
  const sourceIdx = TOPICS.findIndex(t=>t.key===sourceKey);
  const newTopic = {key:newKey, label:source.label+' (copy)', group:source.group, custom:true};
  TOPICS.splice(sourceIdx+1, 0, newTopic);
  const sourceTasks = tasks.filter(t=>t.topic===sourceKey);
  sourceTasks.forEach(t=>{
    tasks.push({
      id: nextTaskId++,
      topic: newKey,
      text: t.text,
      status: t.status,
      priority: t.priority,
      comment: t.comment,
      images: (t.images||[]).slice(),
      files: (t.files||[]).slice(),
      links: (t.links||[]).slice(),
      dueDate: t.dueDate,
      emailReminder: t.emailReminder
    });
  });
  saveStorage();
  renderOverview();
  renderTopicViews();
  switchView(newKey);
}

function duplicateTheme(groupName){
  snapshotBeforeChange('before duplicating theme: '+groupName);
  const newGroup = groupName + ' (copy)';
  const topicsInGroup = TOPICS.filter(t=>t.group===groupName);
  let firstNewKey = null;
  topicsInGroup.forEach(source=>{
    const newKey = 'custom' + (nextCustomTopicId++);
    if(!firstNewKey) firstNewKey = newKey;
    TOPICS.push({key:newKey, label:source.label, group:newGroup, custom:true});
    const sourceTasks = tasks.filter(t=>t.topic===source.key);
    sourceTasks.forEach(t=>{
      tasks.push({
        id: nextTaskId++,
        topic: newKey,
        text: t.text,
        status: t.status,
        priority: t.priority,
        comment: t.comment,
        images: (t.images||[]).slice(),
        files: (t.files||[]).slice(),
        links: (t.links||[]).slice(),
        dueDate: t.dueDate,
        emailReminder: t.emailReminder
      });
    });
  });
  saveStorage();
  renderOverview();
  renderTopicViews();
  switchView('overview');
}

let draggedTaskId = null;

function renderTaskList(topicKey){
  const el = document.getElementById('tasklist-'+topicKey);
  el.innerHTML = '';
  const topicTasks = tasks.filter(t=>t.topic===topicKey);
  const activeTasks = topicTasks.filter(t=>t.status!=='done');
  const doneTasks = topicTasks.filter(t=>t.status==='done');

  if(topicTasks.length === 0){
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = 'No tasks yet — add the first one below.';
    el.appendChild(note);
  }

  const activeList = document.createElement('div');
  activeList.className = 'active-list';
  activeList.id = 'active-list-'+topicKey;
  el.appendChild(activeList);

  activeTasks.forEach(task=>{
    activeList.appendChild(buildTaskCard(task, topicKey, true));
  });

  if(doneTasks.length){
    const divider = document.createElement('div');
    divider.className = 'done-divider';
    divider.textContent = 'Done';
    el.appendChild(divider);
    doneTasks.forEach(task=>{
      el.appendChild(buildTaskCard(task, topicKey, false));
    });
  }

  const addRow = document.createElement('div');
  addRow.className = 'add-row';
  addRow.innerHTML = `
    <input type="text" placeholder="Add a task...">
    <select><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select>
    <button class="add-btn">Add</button>
  `;
  const input = addRow.querySelector('input');
  const sel = addRow.querySelector('select');
  const btn = addRow.querySelector('button');
  btn.addEventListener('click', ()=>{
    const text = input.value.trim();
    if(!text) return;
    tasks.push({id:nextTaskId++, topic:topicKey, text, status:'not_started', priority:sel.value, comment:'', images:[], files:[], links:[], dueDate:null, emailReminder:false});
    saveStorage(); renderOverview(); renderNav(topicKey); renderTaskList(topicKey);
  });
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') btn.click(); });
  el.appendChild(addRow);
}

function reorderTasks(draggedId, targetId){
  const draggedIdx = tasks.findIndex(t=>t.id===draggedId);
  if(draggedIdx === -1) return;
  const [draggedTask] = tasks.splice(draggedIdx, 1);
  const targetIdx = tasks.findIndex(t=>t.id===targetId);
  if(targetIdx === -1){ tasks.push(draggedTask); }
  else { tasks.splice(targetIdx, 0, draggedTask); }
  saveStorage();
}

function buildTaskCard(task, topicKey, draggableEnabled){
    const card = document.createElement('div');
    card.className = 'task-card';
    card.setAttribute('data-id', task.id);
    if(draggableEnabled){
      card.setAttribute('draggable', 'true');
      card.addEventListener('dragstart', (e)=>{
        draggedTaskId = task.id;
        try{ e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(task.id)); }catch(err){}
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', ()=>{
        card.classList.remove('dragging');
        draggedTaskId = null;
        document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
      });
      card.addEventListener('dragover', (e)=>{
        e.preventDefault();
        if(draggedTaskId !== null && draggedTaskId !== task.id){
          card.classList.add('drag-over');
        }
      });
      card.addEventListener('dragleave', ()=>{ card.classList.remove('drag-over'); });
      card.addEventListener('drop', (e)=>{
        e.preventDefault();
        card.classList.remove('drag-over');
        if(draggedTaskId === null || draggedTaskId === task.id) return;
        reorderTasks(draggedTaskId, task.id);
        draggedTaskId = null;
        renderOverview(); renderNav(topicKey); renderTaskList(topicKey);
      });
    }

    if(draggableEnabled){
      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.innerHTML = icon('dots');
      handle.title = 'Drag to reorder';
      card.appendChild(handle);
    }

    const check = document.createElement('button');
    check.className = 'task-check' + (task.status==='done'?' done':'');
    check.addEventListener('click', ()=>{
      task.status = task.status==='done' ? 'not_started' : 'done';
      saveStorage(); renderOverview(); renderNav(topicKey); renderTaskList(topicKey);
    });

    const body = document.createElement('div');
    body.className = 'task-body';

    const top = document.createElement('div');
    top.className = 'task-top';

    const text = document.createElement('span');
    text.className = 'task-text' + (task.status==='done'?' done':'');
    text.textContent = task.text;
    text.addEventListener('click', ()=>{ task._expanded = !task._expanded; renderTaskList(topicKey); });

    const pill = document.createElement('select');
    pill.className = 'priority-select ' + task.priority;
    [['low','low'],['medium','medium'],['high','high']].forEach(([v,l])=>{
      const opt = document.createElement('option');
      opt.value=v; opt.textContent=l;
      if(task.priority===v) opt.selected=true;
      pill.appendChild(opt);
    });
    pill.addEventListener('change', (e)=>{
      task.priority = e.target.value;
      saveStorage(); renderOverview(); renderNav(topicKey); renderTaskList(topicKey);
    });

    const statusSel = document.createElement('select');
    statusSel.className = 'status-select ' + task.status;
    [['not_started','Not started'],['in_progress','In progress'],['done','Done'],['blocked','Blocked']].forEach(([v,l])=>{
      const opt = document.createElement('option');
      opt.value=v; opt.textContent=l;
      if(task.status===v) opt.selected=true;
      statusSel.appendChild(opt);
    });
    statusSel.addEventListener('change', (e)=>{
      task.status = e.target.value;
      saveStorage(); renderOverview(); renderNav(topicKey); renderTaskList(topicKey);
    });

    const imgBtn = document.createElement('button');
    imgBtn.className = 'icon-btn';
    imgBtn.title = 'Attach image or file (PDF, Word, PowerPoint, Excel)';
    imgBtn.innerHTML = icon('image');
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = 'image/*,.pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/vnd.ms-powerpoint,application/vnd.openxmlformats-officedocument.presentationml.presentation,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
    fileInput.style.display = 'none';
    const MAX_DOC_BYTES = 300 * 1024; // 300KB raw - keeps the synced Firestore document (1MB total, shared across ALL tasks) from filling up fast
    fileInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      if(file.type.startsWith('image/')){
        fileToResizedDataUrl(file, 480, (dataUrl)=>{
          if(!task.images) task.images = [];
          task.images.push(dataUrl);
          saveStorage(); renderTaskList(topicKey);
        });
      } else {
        if(file.size > MAX_DOC_BYTES){
          alert('That file is '+Math.round(file.size/1024)+'KB. To keep everyone\'s sync fast, files attached here are capped at 300KB. For anything bigger, use the link button and paste a Google Drive link instead.');
          fileInput.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev)=>{
          if(!task.files) task.files = [];
          task.files.push({name: file.name, type: file.type, size: file.size, dataUrl: ev.target.result});
          saveStorage(); renderTaskList(topicKey);
        };
        reader.readAsDataURL(file);
      }
      fileInput.value = '';
    });
    imgBtn.addEventListener('click', ()=>fileInput.click());

    const linkBtn = document.createElement('button');
    linkBtn.className = 'icon-btn';
    linkBtn.title = 'Add Google Drive link';
    linkBtn.innerHTML = icon('link');
    linkBtn.addEventListener('click', ()=>{
      const url = prompt('Paste Google Drive (or any) link:');
      if(url && url.trim()){
        if(!task.links) task.links = [];
        task.links.push(url.trim());
        saveStorage(); renderTaskList(topicKey);
      }
    });

    const calBtn = document.createElement('button');
    calBtn.className = 'icon-btn';
    calBtn.title = 'Set due date';
    calBtn.innerHTML = icon('calendar');
    calBtn.addEventListener('click', ()=>{ task._dueOpen = !task._dueOpen; renderTaskList(topicKey); });

    const moveBtn = document.createElement('button');
    moveBtn.className = 'icon-btn';
    moveBtn.title = 'Move to another master task';
    moveBtn.innerHTML = icon('move');
    moveBtn.addEventListener('click', ()=>{ task._moveOpen = !task._moveOpen; renderTaskList(topicKey); });

    let dueBadge = null;
    if(task.dueDate && !task._dueOpen){
      const today = new Date().toISOString().slice(0,10);
      dueBadge = document.createElement('span');
      let cls = 'due-badge' + (task.emailReminder ? ' reminder' : '');
      if(task.dueDate < today) cls += ' overdue';
      else if(task.dueDate === today) cls += ' today';
      dueBadge.className = cls;
      dueBadge.innerHTML = (task.emailReminder ? icon('bell') : '') + '<span>'+task.dueDate+'</span>';
      dueBadge.title = task.emailReminder ? 'Email reminder set for this date' : 'Due date, no reminder';
      dueBadge.addEventListener('click', ()=>{ task._dueOpen = true; renderTaskList(topicKey); });
    }

    const del = document.createElement('button');
    del.className = 'task-del';
    del.textContent = 'Delete task';
    del.title = 'Delete this entire task';
    del.addEventListener('click', ()=>{
      if(confirm('Delete this task? This removes it and any attached images/files/links.')){
        snapshotBeforeChange('before deleting: '+task.text);
        tasks = tasks.filter(t=>t.id!==task.id);
        saveStorage(); renderOverview(); renderNav(topicKey); renderTaskList(topicKey);
      }
    });

    top.appendChild(check);
    top.appendChild(text);
    top.appendChild(pill);
    top.appendChild(statusSel);
    if(dueBadge) top.appendChild(dueBadge);
    top.appendChild(calBtn);
    top.appendChild(imgBtn);
    top.appendChild(fileInput);
    top.appendChild(linkBtn);
    top.appendChild(moveBtn);
    top.appendChild(del);
    body.appendChild(top);

    if(task._moveOpen){
      const panel = document.createElement('div');
      panel.className = 'due-panel';
      const label = document.createElement('label');
      label.textContent = 'Send to master task:';
      const select = document.createElement('select');
      select.style.cssText = 'border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-family:Inter,sans-serif;font-size:12.5px;';
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = 'Choose master task...';
      select.appendChild(placeholder);
      TOPICS.filter(t=>t.key!==topicKey).forEach(t=>{
        const opt = document.createElement('option');
        opt.value = t.key;
        opt.textContent = t.label;
        select.appendChild(opt);
      });
      const moveActionBtn = document.createElement('button');
      moveActionBtn.className = 'due-remove';
      moveActionBtn.textContent = 'Move';
      moveActionBtn.style.textDecoration = 'none';
      moveActionBtn.addEventListener('click', ()=>{
        if(!select.value) return;
        snapshotBeforeChange('before moving task: '+task.text);
        task.topic = select.value;
        task._moveOpen = false;
        saveStorage(); renderOverview(); renderNav(topicKey); renderTaskList(topicKey);
      });
      const copyActionBtn = document.createElement('button');
      copyActionBtn.className = 'due-remove';
      copyActionBtn.textContent = 'Copy';
      copyActionBtn.addEventListener('click', ()=>{
        if(!select.value) return;
        tasks.push({
          id: nextTaskId++,
          topic: select.value,
          text: task.text,
          status: task.status,
          priority: task.priority,
          comment: task.comment,
          images: (task.images||[]).slice(),
          files: (task.files||[]).slice(),
          links: (task.links||[]).slice(),
          dueDate: task.dueDate,
          emailReminder: task.emailReminder
        });
        task._moveOpen = false;
        saveStorage(); renderOverview(); renderNav(topicKey); renderTaskList(topicKey);
      });
      const cancelActionBtn = document.createElement('button');
      cancelActionBtn.className = 'due-remove';
      cancelActionBtn.textContent = 'Cancel';
      cancelActionBtn.addEventListener('click', ()=>{ task._moveOpen = false; renderTaskList(topicKey); });
      panel.appendChild(label);
      panel.appendChild(select);
      panel.appendChild(moveActionBtn);
      panel.appendChild(copyActionBtn);
      panel.appendChild(cancelActionBtn);
      body.appendChild(panel);
    }

    if(task._dueOpen){
      const panel = document.createElement('div');
      panel.className = 'due-panel';
      const dateInput = document.createElement('input');
      dateInput.type = 'date';
      dateInput.value = task.dueDate || '';
      dateInput.addEventListener('change', (e)=>{ task.dueDate = e.target.value; saveStorage(); });
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !!task.emailReminder;
      checkbox.addEventListener('change', (e)=>{ task.emailReminder = e.target.checked; saveStorage(); });
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode('Email reminder on this date (optional)'));
      const doneBtn = document.createElement('button');
      doneBtn.className = 'due-remove';
      doneBtn.textContent = 'Done';
      doneBtn.style.textDecoration = 'none';
      doneBtn.addEventListener('click', ()=>{ task._dueOpen = false; renderTaskList(topicKey); });
      const removeBtn = document.createElement('button');
      removeBtn.className = 'due-remove';
      removeBtn.textContent = 'Remove due date';
      removeBtn.addEventListener('click', ()=>{ task.dueDate=null; task.emailReminder=false; task._dueOpen=false; saveStorage(); renderTaskList(topicKey); });
      panel.appendChild(dateInput);
      panel.appendChild(label);
      panel.appendChild(doneBtn);
      panel.appendChild(removeBtn);
      body.appendChild(panel);
    }

    if(task._expanded){
      const box = document.createElement('textarea');
      box.className = 'comment-input';
      box.placeholder = 'Add a comment...';
      box.value = task.comment || '';
      box.addEventListener('blur', (e)=>{ task.comment = e.target.value; saveStorage(); });
      body.appendChild(box);
    } else if(task.comment){
      const c = document.createElement('div');
      c.className = 'task-comment';
      c.textContent = task.comment;
      body.appendChild(c);
    }

    if((task.images && task.images.length) || (task.files && task.files.length) || (task.links && task.links.length)){
      const attachRow = document.createElement('div');
      attachRow.className = 'attach-row';
      (task.images||[]).forEach((src, idx)=>{
        const wrap = document.createElement('div');
        wrap.className = 'thumb-wrap';
        const thumb = document.createElement('img');
        thumb.className = 'thumb';
        thumb.src = src;
        thumb.addEventListener('click', ()=>openImageModal(src));
        const x = document.createElement('button');
        x.className = 'attach-x';
        x.innerHTML = '&times;';
        x.title = 'Remove image';
        x.addEventListener('click', (e)=>{
          e.stopPropagation();
          task.images.splice(idx,1);
          saveStorage(); renderTaskList(topicKey);
        });
        wrap.appendChild(thumb);
        wrap.appendChild(x);
        attachRow.appendChild(wrap);
      });
      (task.files||[]).forEach((f, idx)=>{
        const wrap = document.createElement('div');
        wrap.className = 'drive-chip-wrap';
        const chip = document.createElement('a');
        chip.className = 'drive-chip';
        chip.href = f.dataUrl;
        chip.download = f.name;
        chip.title = f.name + ' (' + Math.round((f.size||0)/1024) + 'KB) — click to download';
        const shortName = f.name.length > 22 ? f.name.slice(0,19)+'…' : f.name;
        chip.innerHTML = `${icon('file')} ${shortName}`;
        const x = document.createElement('button');
        x.className = 'chip-x';
        x.innerHTML = '&times;';
        x.title = 'Remove file';
        x.addEventListener('click', (e)=>{
          e.preventDefault(); e.stopPropagation();
          task.files.splice(idx,1);
          saveStorage(); renderTaskList(topicKey);
        });
        wrap.appendChild(chip);
        wrap.appendChild(x);
        attachRow.appendChild(wrap);
      });
      (task.links||[]).forEach((url, idx)=>{
        const wrap = document.createElement('div');
        wrap.className = 'drive-chip-wrap';
        const chip = document.createElement('a');
        chip.className = 'drive-chip';
        chip.href = url;
        chip.target = '_blank';
        chip.rel = 'noopener noreferrer';
        let display = url;
        try{ display = new URL(url).hostname.replace('www.',''); }catch(e){}
        chip.innerHTML = `${icon('link')} ${display}`;
        const x = document.createElement('button');
        x.className = 'chip-x';
        x.innerHTML = '&times;';
        x.title = 'Remove link';
        x.addEventListener('click', (e)=>{
          e.preventDefault(); e.stopPropagation();
          task.links.splice(idx,1);
          saveStorage(); renderTaskList(topicKey);
        });
        wrap.appendChild(chip);
        wrap.appendChild(x);
        attachRow.appendChild(wrap);
      });
      body.appendChild(attachRow);
    }

    card.appendChild(body);
    return card;
}

document.getElementById('export-ics-btn').addEventListener('click', ()=>{
  const reminderTasks = tasks.filter(t=>t.dueDate && t.emailReminder);
  if(!reminderTasks.length){
    alert('No tasks have an email reminder set yet. Click the calendar icon on a task to add one.');
    return;
  }
  const pad = n => String(n).padStart(2,'0');
  const stamp = ()=>{
    const d = new Date();
    return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';
  };
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//VIRT Ops Ledger//EN\r\n';
  reminderTasks.forEach(t=>{
    const dateStr = t.dueDate.replace(/-/g,'');
    const topicLabel = TOPICS.find(x=>x.key===t.topic).label;
    ics += 'BEGIN:VEVENT\r\n';
    ics += 'UID:'+t.id+'-'+dateStr+'@virt-ops-ledger\r\n';
    ics += 'DTSTAMP:'+stamp()+'\r\n';
    ics += 'DTSTART;VALUE=DATE:'+dateStr+'\r\n';
    ics += 'DTEND;VALUE=DATE:'+dateStr+'\r\n';
    ics += 'SUMMARY:VIRT deadline - '+t.text.replace(/[\r\n]/g,' ')+'\r\n';
    ics += 'DESCRIPTION:Topic: '+topicLabel+'\r\n';
    ics += 'BEGIN:VALARM\r\nACTION:EMAIL\r\nTRIGGER:PT0M\r\nSUMMARY:VIRT deadline today\r\nDESCRIPTION:'+t.text.replace(/[\r\n]/g,' ')+'\r\n';
    ics += 'END:VALARM\r\n';
    ics += 'END:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR\r\n';
  const blob = new Blob([ics], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'virt-reminders.ics'; a.click();
  URL.revokeObjectURL(url);
});

  reader.onload = (evt)=>{
    try{
      const imported = JSON.parse(evt.target.result);
      if(imported.tasks){
        tasks = imported.tasks;
        formulaRows = imported.formulaRows || [];
        TOPICS = (imported.topics && imported.topics.length) ? imported.topics : BASE_TOPICS.slice();
        nextTaskId = Math.max(0, ...tasks.map(t=>t.id||0)) + 1;
        nextFormulaId = Math.max(0, ...formulaRows.map(r=>r.id||0)) + 1;
        nextCustomTopicId = 1;
        TOPICS.forEach(t=>{
          const m = /^custom(\d+)$/.exec(t.key);
          if(m) nextCustomTopicId = Math.max(nextCustomTopicId, Number(m[1])+1);
        });
        saveStorage();
        renderOverview(); renderTopicViews(); switchView('overview');
      }
    }catch(err){ alert('Could not read that file.'); }
  };
  reader.readAsText(file);
});

async function initApp(){
  const stored = await loadStorage();
  if(stored && stored.tasks && stored.tasks.length){
    tasks = stored.tasks;
    formulaRows = stored.formulaRows || [];
    TOPICS = (stored.topics && stored.topics.length) ? stored.topics : BASE_TOPICS.slice();
  } else {
    tasks = JSON.parse(JSON.stringify(SEED_TASKS));
    formulaRows = JSON.parse(JSON.stringify(SEED_FORMULA));
    TOPICS = BASE_TOPICS.slice();
  }
  nextCustomTopicId = 1;
  TOPICS.forEach(t=>{
    const m = /^custom(\d+)$/.exec(t.key);
    if(m) nextCustomTopicId = Math.max(nextCustomTopicId, Number(m[1])+1);
  });

  // Additive merge: add any new regulation tasks the user doesn't already have,
  // matched by fixed id, without touching or reordering existing tasks.
  const existingIds = new Set(tasks.map(t=>t.id));
  let addedAny = false;
  REGULATION_TASKS.forEach(regTask=>{
    if(!existingIds.has(regTask.id)){
      tasks.push(JSON.parse(JSON.stringify(regTask)));
      addedAny = true;
    }
  });

  nextTaskId = Math.max(0, ...tasks.map(t=>t.id||0)) + 1;
  nextFormulaId = Math.max(0, ...formulaRows.map(r=>r.id||0)) + 1;
  lastSavedSnapshot = JSON.stringify({tasks, formulaRows, topics: TOPICS});
  if(addedAny) saveStorage();
  history = await loadHistory();
  renderOverview();
  renderTopicViews();
  switchView('overview');
  updateUndoRedoButtons();
}

function showLoginError(msg){
  loginError.textContent = msg;
  loginError.classList.add('show');
}
function clearLoginError(){
  loginError.textContent = '';
  loginError.classList.remove('show');
}

function friendlyAuthError(e){
  const code = (e && e.code) || '';
  if(code.indexOf('invalid-credential') !== -1 || code.indexOf('wrong-password') !== -1 || code.indexOf('user-not-found') !== -1){
    return 'That email or password did not match. If this is your first time, use "Create my account" below.';
  }
  if(code.indexOf('email-already-in-use') !== -1){
    return 'An account already exists for this email — use Sign in instead.';
  }
  if(code.indexOf('weak-password') !== -1){
    return 'Password needs to be at least 6 characters.';
  }
  if(code.indexOf('invalid-email') !== -1){
    return 'That does not look like a valid email address.';
  }
  if(code.indexOf('network') !== -1){
    return 'Network problem — check your connection and try again.';
  }
  return (e && e.message) ? e.message : 'Something went wrong. Please try again.';
}

// ---- Sidebar resize ----
(function(){
  const sidebar = document.getElementById('main-sidebar');
  const handle = document.getElementById('sidebar-resize-handle');
  if(!sidebar || !handle) return;
  const MIN = 180, MAX = 420;
  try{
    const saved = localStorage.getItem('virt-sidebar-width');
    if(saved) sidebar.style.width = Math.min(MAX, Math.max(MIN, Number(saved))) + 'px';
  }catch(e){}
  let startX, startW;
  handle.addEventListener('mousedown', (e)=>{
    startX = e.clientX;
    startW = sidebar.getBoundingClientRect().width;
    handle.classList.add('dragging');
    document.body.style.cursor = 'col-resize';
    document.body.style.userSelect = 'none';
  });
  document.addEventListener('mousemove', (e)=>{
    if(!handle.classList.contains('dragging')) return;
    const newW = Math.min(MAX, Math.max(MIN, startW + (e.clientX - startX)));
    sidebar.style.width = newW + 'px';
  });
  document.addEventListener('mouseup', ()=>{
    if(!handle.classList.contains('dragging')) return;
    handle.classList.remove('dragging');
    document.body.style.cursor = '';
    document.body.style.userSelect = '';
    try{ localStorage.setItem('virt-sidebar-width', sidebar.getBoundingClientRect().width); }catch(e){}
  });
})();

const _signoutBtn = document.getElementById('signout-btn');
if(_signoutBtn){ _signoutBtn.addEventListener('click', async ()=>{
  if(!firebaseReady || !currentUser){
    alert('Cloud sync is not active here, so there is nothing to sign out of. Open the live site to sign in.');
    return;
  }
  if(!confirm('Sign out? Your data stays safely in the cloud and will be here when you sign back in.')) return;
  if(cloudSaveTimer){
    clearTimeout(cloudSaveTimer);
    try{
      await fbDb.collection('trackers').doc(currentUser.uid).set({payload: pendingPayload, updatedAt: Date.now()});
    }catch(e){}
  }
  await fbAuth.signOut();
  location.reload();
}); }
document.addEventListener('keydown', (e)=>{
  const meta = e.metaKey || e.ctrlKey;
  if(!meta) return;
  const key = e.key.toLowerCase();
  if(key === 'z' && !e.shiftKey){ e.preventDefault(); performUndo(); }
  else if((key === 'z' && e.shiftKey) || key === 'y'){ e.preventDefault(); performRedo(); }
});
</script>
</body>
</html>
