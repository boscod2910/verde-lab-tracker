<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verde Lab — Project Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F5F6F8;
    --sidebar: #FFFFFF;
    --card: #FFFFFF;
    --line: #E7E8EC;
    --ink: #1B1D23;
    --ink-dim: #6B6F7A;
    --ink-faint: #9AA0AC;
    --accent: #5B5BD6;
    --accent-light: #EEEEFB;
    --accent-dark: #3F3FB0;
    --green: #1F9D6B;
    --green-bg: #E5F7EF;
    --amber: #B6790A;
    --amber-bg: #FDF2DF;
    --red: #C4432E;
    --red-bg: #FBEAE6;
    --gray-bg: #F0F1F3;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter', sans-serif;display:flex;min-height:100vh;}
  .sidebar{width:250px;background:var(--sidebar);border-right:1px solid var(--line);padding:24px 14px;flex-shrink:0;position:sticky;top:0;height:100vh;overflow-y:auto;}
  .brand{font-family:'Manrope', sans-serif;font-weight:800;font-size:16px;letter-spacing:-0.01em;padding:0 8px 4px;}
  .brand-sub{font-size:11.5px;color:var(--ink-faint);padding:0 8px 20px;}
  .nav-group-label{font-size:10.5px;font-weight:700;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;padding:14px 10px 4px;}
  .nav-item{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:8px;font-size:13px;font-weight:500;color:var(--ink-dim);cursor:pointer;margin-bottom:1px;}
  .nav-item:hover{background:var(--gray-bg);}
  .nav-item.active{background:var(--accent-light);color:var(--accent-dark);font-weight:600;}
  .nav-dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);flex-shrink:0;}
  .nav-item.active .nav-dot{background:var(--accent);}
  .nav-pct{margin-left:auto;font-size:10.5px;color:var(--ink-faint);}
  .nav-item.active .nav-pct{color:var(--accent-dark);}
  .nav-add-btn{margin-top:14px;padding:8px 10px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--accent-dark);background:var(--accent-light);cursor:pointer;text-align:center;}
  .nav-add-btn:hover{background:#E1E1FA;}
  .main{flex:1;padding:32px 40px 60px;max-width:960px;}
  .page-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:24px;}
  .page-head h1{font-family:'Manrope', sans-serif;font-weight:700;font-size:23px;margin:0 0 4px;}
  .page-head .sub{font-size:13px;color:var(--ink-dim);}
  .view{display:none;}
  .view.active{display:block;}

  .kpi-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px;}
  .kpi-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .kpi-label{font-size:12px;color:var(--ink-dim);margin-bottom:6px;}
  .kpi-value{font-family:'Manrope', sans-serif;font-weight:700;font-size:26px;}
  .kpi-value.accent{color:var(--accent-dark);}
  .kpi-value.red{color:var(--red);}

  .section-label{font-size:12.5px;font-weight:600;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.04em;margin:28px 0 12px;}
  .topic-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .topic-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color 0.15s ease;}
  .topic-card:hover{border-color:var(--accent);}
  .topic-card-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;}
  .topic-card-top h3{font-size:13.5px;font-weight:600;margin:0;}
  .topic-card-top .count{font-size:11.5px;color:var(--ink-faint);white-space:nowrap;}
  .bar-track{height:6px;background:var(--gray-bg);border-radius:3px;overflow:hidden;margin-bottom:8px;}
  .bar-fill{height:100%;background:var(--accent);border-radius:3px;}
  .topic-card-foot{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink-faint);}
  .flag-row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;font-size:13px;}
  .flag-row .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
  .flag-row .dot.high{background:var(--red);}
  .flag-row .dot.blocked{background:var(--amber);}
  .flag-row .topic-tag{margin-left:auto;font-size:11px;color:var(--ink-faint);background:var(--gray-bg);padding:2px 8px;border-radius:8px;white-space:nowrap;}

  .task-card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:8px;display:flex;align-items:flex-start;gap:12px;}
  .task-check{width:18px;height:18px;border-radius:6px;border:1.5px solid #C7C9D1;background:#fff;cursor:pointer;flex-shrink:0;margin-top:2px;display:flex;align-items:center;justify-content:center;padding:0;}
  .task-check.done{background:var(--green);border-color:var(--green);}
  .task-check.done::after{content:'\2713';color:#fff;font-size:11px;}
  .task-body{flex:1;min-width:0;}
  .task-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .task-text{font-size:14px;cursor:pointer;}
  .task-text.done{color:var(--ink-faint);text-decoration:line-through;}
  .pill{font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:8px;letter-spacing:0.02em;}
  .pill.high{background:var(--red-bg);color:var(--red);}
  .pill.medium{background:var(--amber-bg);color:var(--amber);}
  .pill.low{background:var(--gray-bg);color:var(--ink-dim);}
  select.status-select{font-size:11px;font-weight:600;border:none;border-radius:8px;padding:3px 8px;font-family:'Inter',sans-serif;cursor:pointer;}
  .status-select.not_started{background:var(--gray-bg);color:var(--ink-dim);}
  .status-select.in_progress{background:var(--amber-bg);color:var(--amber);}
  .status-select.done{background:var(--green-bg);color:var(--green);}
  .status-select.blocked{background:var(--red-bg);color:var(--red);}
  .icon-btn{background:none;border:none;color:var(--ink-faint);cursor:pointer;padding:3px;opacity:0.6;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;}
  .icon-btn:hover{opacity:1;color:var(--accent);background:var(--accent-light);}
  .icon-btn svg{display:block;}
  .task-del{background:none;border:1px solid var(--line);color:var(--ink-faint);cursor:pointer;font-size:12px;padding:4px 9px;border-radius:8px;opacity:0.7;white-space:nowrap;}
  .task-del:hover{opacity:1;color:var(--red);border-color:var(--red-bg);background:var(--red-bg);}
  .task-comment{font-size:12.5px;color:var(--ink-dim);margin-top:6px;}
  .comment-input{width:100%;border:1px solid var(--line);border-radius:6px;font-size:12.5px;font-family:'Inter',sans-serif;padding:6px 8px;margin-top:6px;min-height:32px;}
  .attach-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;align-items:center;}
  .thumb-wrap{position:relative;width:36px;height:36px;flex-shrink:0;}
  .thumb{width:36px;height:36px;border-radius:6px;object-fit:cover;cursor:pointer;border:1px solid var(--line);display:block;}
  .attach-x{position:absolute;top:-6px;right:-6px;width:16px;height:16px;border-radius:50%;background:var(--ink);color:#fff;border:none;font-size:10px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:0.85;}
  .attach-x:hover{background:var(--red);opacity:1;}
  .drive-chip-wrap{position:relative;display:inline-flex;align-items:center;}
  .drive-chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;background:var(--accent-light);color:var(--accent-dark);padding:3px 20px 3px 9px;border-radius:8px;text-decoration:none;}
  .drive-chip:hover{background:#E1E1FA;}
  .chip-x{position:absolute;right:4px;top:50%;transform:translateY(-50%);cursor:pointer;opacity:0.5;font-size:12px;color:var(--accent-dark);background:none;border:none;padding:0 2px;line-height:1;}
  .chip-x:hover{opacity:1;color:var(--red);}
  .due-badge{font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:8px;cursor:pointer;background:var(--gray-bg);color:var(--ink-dim);white-space:nowrap;}
  .due-badge.today{background:var(--amber-bg);color:var(--amber);}
  .due-badge.overdue{background:var(--red-bg);color:var(--red);}
  .due-badge.reminder{display:inline-flex;align-items:center;gap:4px;}
  .due-panel{display:flex;align-items:center;gap:10px;margin-top:8px;padding:10px 12px;background:var(--gray-bg);border-radius:8px;font-size:12.5px;flex-wrap:wrap;}
  .due-panel input[type=date]{border:1px solid var(--line);border-radius:6px;padding:5px 7px;font-family:'Inter',sans-serif;font-size:12.5px;}
  .due-panel label{display:flex;align-items:center;gap:5px;color:var(--ink-dim);}
  .due-panel .due-remove{background:none;border:none;color:var(--ink-faint);cursor:pointer;font-size:12px;text-decoration:underline;}
  .due-panel .due-remove:hover{color:var(--red);}
  .drag-handle{cursor:grab;color:var(--ink-faint);padding:2px;margin-top:3px;flex-shrink:0;user-select:none;display:inline-flex;align-items:center;}
  .drag-handle svg{display:block;}
  .drag-handle:active{cursor:grabbing;}
  .task-card.dragging{opacity:0.4;}
  .task-card.drag-over{border-color:var(--accent);box-shadow:inset 0 2px 0 var(--accent);}
  .done-divider{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:0.05em;margin:14px 0 8px;padding-top:4px;border-top:1px dashed var(--line);}
  .add-row{display:flex;gap:8px;margin-top:12px;}
  .add-row input[type=text]{flex:1;border:1px solid var(--line);border-radius:8px;font-size:13px;padding:8px 10px;font-family:'Inter',sans-serif;}
  .add-row select{border:1px solid var(--line);border-radius:8px;font-size:12px;padding:8px;font-family:'Inter',sans-serif;color:var(--ink-dim);}
  .add-btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;}
  .add-btn:hover{background:var(--accent-dark);}
  .empty-note{font-size:13px;color:var(--ink-faint);padding:20px 0;}

  .formula-panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:22px;}
  .formula-panel h3{font-family:'Manrope',sans-serif;font-size:15px;margin:0 0 2px;}
  .formula-version{font-size:12px;color:var(--ink-faint);margin-bottom:14px;}
  table.formula-table{width:100%;border-collapse:collapse;font-size:13px;}
  table.formula-table th{text-align:left;font-size:11px;color:var(--ink-faint);font-weight:600;text-transform:uppercase;letter-spacing:0.03em;padding:0 8px 8px 0;border-bottom:1px solid var(--line);}
  table.formula-table td{padding:8px 8px 8px 0;border-bottom:1px solid var(--line);vertical-align:top;}
  table.formula-table input{width:100%;border:none;background:transparent;font-size:13px;font-family:'Inter',sans-serif;padding:2px 0;}
  table.formula-table input:focus{outline:none;border-bottom:1px solid var(--accent);}
  .formula-del{background:none;border:none;color:var(--ink-faint);cursor:pointer;opacity:0.5;font-size:14px;}
  .formula-del:hover{opacity:1;color:var(--red);}
  .formula-add-btn{margin-top:10px;background:var(--gray-bg);border:none;border-radius:8px;padding:6px 14px;font-size:12.5px;color:var(--ink-dim);cursor:pointer;}
  .formula-add-btn:hover{background:var(--accent-light);color:var(--accent-dark);}

  .modal-overlay{position:fixed;inset:0;background:rgba(20,20,25,0.65);display:flex;align-items:center;justify-content:center;z-index:100;}
  .modal-overlay img{max-width:90vw;max-height:85vh;border-radius:8px;}
  .footer-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px;}
  .footer-actions button{background:none;border:1px solid var(--line);color:var(--ink-dim);font-size:11.5px;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:'Inter',sans-serif;}
  .footer-actions button:hover{color:var(--accent-dark);border-color:var(--accent);}
  #import-file{display:none;}
  .history-modal{background:#fff;border-radius:12px;max-width:520px;width:90%;max-height:80vh;overflow-y:auto;padding:22px 24px;}
  .history-modal h3{font-family:'Manrope',sans-serif;margin:0 0 4px;font-size:17px;}
  .history-modal .sub{font-size:12.5px;color:var(--ink-dim);margin-bottom:16px;}
  .history-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .history-row:last-child{border-bottom:none;}
  .history-meta{color:var(--ink-dim);}
  .history-restore{background:var(--accent-light);color:var(--accent-dark);border:none;border-radius:8px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;}
  .history-restore:hover{background:#E1E1FA;}
  .history-empty{font-size:13px;color:var(--ink-faint);padding:12px 0;}
  .export-reminder{background:var(--gray-bg);color:var(--ink-dim);border-radius:8px;padding:8px 14px;font-size:12px;margin-bottom:16px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .export-reminder button{background:var(--accent);border:none;color:#fff;border-radius:6px;padding:4px 12px;font-size:11.5px;font-weight:600;cursor:pointer;}
  .export-reminder button:hover{background:var(--accent-dark);}
</style>
</head>
<body>

<div class="sidebar">
  <div class="brand">Verde Lab</div>
  <div class="brand-sub">Project tracker</div>
  <div id="nav"></div>
</div>

<div class="main">
  <div id="overview" class="view active">
    <div class="page-head">
      <div><h1>Overview</h1><div class="sub">Nexo Austral Europa — all workstreams at a glance</div></div>
    </div>
    <div id="export-reminder-slot"></div>
    <div class="kpi-row" id="kpi-row"></div>
    <div class="section-label">Needs attention</div>
    <div id="flag-list"></div>
    <div class="section-label">Workstreams</div>
    <div class="topic-grid" id="topic-grid"></div>
    <div class="footer-actions">
      <button id="export-btn">Export backup (.json)</button>
      <button id="import-btn">Import backup</button>
      <button id="export-ics-btn">Export reminders (.ics)</button>
      <button id="history-btn">Version history</button>
      <input type="file" id="import-file" accept="application/json">
    </div>
  </div>
  <div id="topic-views"></div>
</div>

<div id="modal-root"></div>

<script>
const BASE_TOPICS = [
  {key:"legal", label:"Legal & Corporate", group:"Foundations"},
  {key:"ip", label:"Intellectual Property", group:"Foundations"},
  {key:"reg-spain", label:"Regulatory — Spain", group:"Foundations"},
  {key:"reg-eu", label:"Regulatory — EU", group:"Foundations"},
  {key:"reg-de", label:"Regulatory — Germany (later)", group:"Foundations"},

  {key:"formula", label:"Master Formula", group:"Product"},
  {key:"rnd", label:"Product R&D & Testing", group:"Product"},
  {key:"supply", label:"Supply Chain & Manufacturing", group:"Product"},
  {key:"packaging", label:"Packaging", group:"Product"},
  {key:"customs", label:"Import / Export & Customs", group:"Product"},

  {key:"brand", label:"Brand & Identity", group:"Go-to-market"},
  {key:"marketing", label:"Marketing & Go-to-Market", group:"Go-to-market"},
  {key:"sales", label:"Sales Channels & Distribution", group:"Go-to-market"},
  {key:"pricing", label:"Pricing & Unit Economics", group:"Go-to-market"},

  {key:"finance", label:"Finance & Accounting", group:"Operations"},
  {key:"banking", label:"Banking & Payments", group:"Operations"},
  {key:"ecom", label:"E-commerce & Tech Stack", group:"Operations"},
  {key:"privacy", label:"Data Privacy / GDPR", group:"Operations"},
  {key:"support", label:"Customer Support & Ops", group:"Operations"},
  {key:"risk", label:"Risk & Contingency", group:"Operations"}
];

let customTopics = [];
let TOPICS = BASE_TOPICS.slice();
let nextCustomTopicId = 1;

function recomputeTopics(){
  TOPICS = BASE_TOPICS.concat(customTopics);
}

function icon(name){
  const icons = {
    calendar: '<svg viewBox="0 0 20 20" width="14" height="14" fill="currentColor"><path d="M6 1.5a1 1 0 0 1 1 1V3h6v-.5a1 1 0 1 1 2 0V3h.5A2.5 2.5 0 0 1 18 5.5v9A2.5 2.5 0 0 1 15.5 17h-11A2.5 2.5 0 0 1 2 14.5v-9A2.5 2.5 0 0 1 4.5 3H5v-.5a1 1 0 0 1 1-1zM4 8v6.5a.5.5 0 0 0 .5.5h11a.5.5 0 0 0 .5-.5V8H4z"/></svg>',
    image: '<svg viewBox="0 0 20 20" width="14" height="14" fill="currentColor"><path d="M4.5 3A2.5 2.5 0 0 0 2 5.5v9A2.5 2.5 0 0 0 4.5 17h11a2.5 2.5 0 0 0 2.5-2.5v-9A2.5 2.5 0 0 0 15.5 3h-11zM7 6.5a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3zM4 14.2l3.6-4.3a.7.7 0 0 1 1.05-.03L11 12.2l1.9-2.4a.7.7 0 0 1 1.1 0l2 2.9V14.5a.5.5 0 0 1-.5.5h-11a.5.5 0 0 1-.5-.5v-.3z"/></svg>',
    link: '<svg viewBox="0 0 20 20" width="14" height="14" fill="currentColor"><path d="M8.4 12.7a1 1 0 0 1 0-1.41l3.2-3.2a1 1 0 1 1 1.41 1.41l-3.2 3.2a1 1 0 0 1-1.41 0zM6.9 14.9l-.9.9a2.7 2.7 0 0 1-3.82-3.82l2.83-2.83a2.7 2.7 0 0 1 3.82 0 1 1 0 0 1-1.41 1.41.7.7 0 0 0-1 0L3.6 13.4a.7.7 0 0 0 1 1l.9-.9a1 1 0 1 1 1.41 1.4zM13.1 5.1l.9-.9a2.7 2.7 0 0 1 3.82 3.82l-2.83 2.83a2.7 2.7 0 0 1-3.82 0 1 1 0 1 1 1.41-1.41.7.7 0 0 0 1 0l2.83-2.83a.7.7 0 0 0-1-1l-.9.9a1 1 0 1 1-1.41-1.4z"/></svg>',

    bell: '<svg viewBox="0 0 20 20" width="11" height="11" fill="currentColor"><path d="M10 2a1 1 0 0 1 1 1v.63a5.5 5.5 0 0 1 4 5.29v2.92l1.36 2.04a1 1 0 0 1-.83 1.55H4.47a1 1 0 0 1-.83-1.55L5 11.84V8.92a5.5 5.5 0 0 1 4-5.29V3a1 1 0 0 1 1-1zm-2 15a2 2 0 0 0 4 0H8z"/></svg>',
    trash: '<svg viewBox="0 0 20 20" width="12" height="12" fill="currentColor"><path d="M8 1.5a1 1 0 0 0-1 1V3H4a1 1 0 0 0 0 2h12a1 1 0 1 0 0-2h-3v-.5a1 1 0 0 0-1-1H8zM4.8 6.5l.8 10.1a2 2 0 0 0 2 1.9h4.8a2 2 0 0 0 2-1.9l.8-10.1H4.8z"/></svg>'
  };
  return icons[name] || '';
}


const REGULATION_TASKS = [
  {id:500,topic:"reg-eu",text:"Reg (EC) 178/2002 - General Food Law: traceability and safety principles",status:"not_started",priority:"medium",comment:"",images:[],links:[],dueDate:null,emailReminder:false},
  {id:501,topic:"reg-eu",text:"Reg (EU) 1169/2011 - Food Information to Consumers: mandatory label content",status:"not_started",priority:"high",comment:"",images:[],links:[],dueDate:null,emailReminder:false},
  {id:502,topic:"reg-eu",text:"Directive 2002/46/EC - Food Supplements Directive",status:"not_started",priority:"medium",comment:"",images:[],links:[],dueDate:null,emailReminder:false},
  {id:503,topic:"reg-eu",text:"Reg (EC) 1924/2006 - Nutrition and Health Claims Regulation",status:"not_started",priority:"high",comment:"Governs every claim VIRT can legally make",images:[],links:[],dueDate:null,emailReminder:false},
  {id:504,topic:"reg-eu",text:"Check EU Register of authorised health claims per ingredient",status:"not_started",priority:"high",comment:"Confirm which claims apply to mate, Lion's Mane, ginger, lucuma",images:[],links:[],dueDate:null,emailReminder:false},
  {id:505,topic:"reg-eu",text:"Confirm Novel Food status for every ingredient (not just Guayusa)",status:"not_started",priority:"high",comment:"Reg (EU) 2015/2283 - check full ingredient list against EU Novel Food Catalogue",images:[],links:[],dueDate:null,emailReminder:false},
  {id:506,topic:"reg-eu",text:"Reg (EU) 2023/915 - contaminants: confirm PAH4 levels on KLM extract",status:"not_started",priority:"high",comment:"PAH4 limit for dried herb/plant powders is 50 micrograms/kg. Argentine-origin yerba mate has repeatedly tested above EU limits in independent studies due to smoke-drying process. Get a PAH4 certificate of analysis from KLM before finalizing sourcing.",images:[],links:[],dueDate:null,emailReminder:false},

let history = [];
const MAX_HISTORY = 8;

async function loadHistory(){
  try{
    if(window.storage){
      const res = await window.storage.get('virt-tracker-history');
      if(res && res.value) return JSON.parse(res.value);
    }
  }catch(e){}
  try{
    const local = localStorage.getItem('virt-tracker-history');
    if(local) return JSON.parse(local);
  }catch(e){}
  return [];
}

async function saveHistory(){
  const payload = JSON.stringify(history);
  try{
    if(window.storage){ await window.storage.set('virt-tracker-history', payload); return; }
  }catch(e){}
  try{ localStorage.setItem('virt-tracker-history', payload); }
  catch(e){
    // storage quota likely hit (large images) - drop oldest half and retry once
    history = history.slice(0, Math.ceil(history.length/2));
    try{ localStorage.setItem('virt-tracker-history', JSON.stringify(history)); }catch(e2){ /* give up silently */ }
  }
}

function snapshotBeforeChange(note){
  history.unshift({
    ts: new Date().toISOString(),
    note: note,
    snapshot: JSON.stringify({tasks, formulaRows})
  });
  if(history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
  saveHistory();
}

function fmtTs(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}) + ' ' + d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
}

function openHistoryModal(){
  const root = document.getElementById('modal-root');
  root.innerHTML = '';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) root.innerHTML=''; });
  const box = document.createElement('div');
  box.className = 'history-modal';
  box.innerHTML = `
    <h3>Version history</h3>
    <div class="sub">Automatic snapshots taken right before each deletion. Restoring is itself undoable.</div>
  `;
  if(!history.length){
    box.innerHTML += '<div class="history-empty">No snapshots yet — one is taken automatically the first time you delete something.</div>';
  } else {
    history.forEach((h, idx)=>{
      const row = document.createElement('div');
      row.className = 'history-row';
      row.innerHTML = `<span class="history-meta">${fmtTs(h.ts)} — ${h.note}</span>`;
      const btn = document.createElement('button');
      btn.className = 'history-restore';
      btn.textContent = 'Restore';
      btn.addEventListener('click', ()=>{
        if(!confirm('Restore this version? Your current state will itself be saved as a snapshot first, so this is reversible.')) return;
        snapshotBeforeChange('before restoring a previous version');
        const restored = JSON.parse(h.snapshot);
        tasks = restored.tasks;
        formulaRows = restored.formulaRows || [];
        nextTaskId = Math.max(0, ...tasks.map(t=>t.id||0)) + 1;
        nextFormulaId = Math.max(0, ...formulaRows.map(r=>r.id||0)) + 1;
        saveStorage();
        root.innerHTML = '';
        renderOverview(); renderTopicViews(); switchView('overview');
      });
      row.appendChild(btn);
      box.appendChild(row);
    });
  }
  overlay.appendChild(box);
  root.appendChild(overlay);
}

function fileToResizedDataUrl(file, maxDim, cb){
  const reader = new FileReader();
  reader.onload = (e)=>{
    const img = new Image();
    img.onload = ()=>{
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = Math.round(h * maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = Math.round(w * maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      cb(canvas.toDataURL('image/jpeg', 0.75));
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

      <td><button class="formula-del">&times;</button></td>
    `;
    tr.querySelectorAll('input').forEach(inp=>{
      inp.addEventListener('blur', (e)=>{
        row[e.target.getAttribute('data-f')] = e.target.value;
        saveStorage();
      });
    });
    tr.querySelector('.formula-del').addEventListener('click', ()=>{
      snapshotBeforeChange('before deleting ingredient: '+(row.name || 'unnamed'));
      formulaRows = formulaRows.filter(r=>r.id!==row.id);
      saveStorage();
      renderTopicViews();
      switchView('formula');
    });
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  panel.appendChild(table);
  const addBtn = document.createElement('button');
  addBtn.className = 'formula-add-btn';
  addBtn.textContent = '+ Add ingredient';
  addBtn.addEventListener('click', ()=>{
    formulaRows.push({id:nextFormulaId++, name:'', dose:'', pct:'', source:'', notes:''});
    saveStorage();
    renderTopicViews();
    switchView('formula');
  });
  panel.appendChild(addBtn);
  slot.appendChild(panel);
}

let draggedTaskId = null;

function renderTaskList(topicKey){
  const el = document.getElementById('tasklist-'+topicKey);
  el.innerHTML = '';
  const topicTasks = tasks.filter(t=>t.topic===topicKey);
  const activeTasks = topicTasks.filter(t=>t.status!=='done');
  const doneTasks = topicTasks.filter(t=>t.status==='done');

  if(topicTasks.length === 0){
    const note = document.createElement('div');
    note.className = 'empty-note';
    note.textContent = 'No tasks yet — add the first one below.';
    el.appendChild(note);
  }

  const activeList = document.createElement('div');
  activeList.className = 'active-list';
  activeList.id = 'active-list-'+topicKey;
  el.appendChild(activeList);

  activeTasks.forEach(task=>{
    activeList.appendChild(buildTaskCard(task, topicKey, true));
  });

  if(doneTasks.length){
    const divider = document.createElement('div');
    divider.className = 'done-divider';
    divider.textContent = 'Done';
    el.appendChild(divider);
    doneTasks.forEach(task=>{
      el.appendChild(buildTaskCard(task, topicKey, false));
    });
  }

  const addRow = document.createElement('div');
  addRow.className = 'add-row';
  addRow.innerHTML = `
    <input type="text" placeholder="Add a task...">
    <select><option value="medium">Medium</option><option value="high">High</option><option value="low">Low</option></select>
    <button class="add-btn">Add</button>
  `;
  const input = addRow.querySelector('input');
  const sel = addRow.querySelector('select');
  const btn = addRow.querySelector('button');
  btn.addEventListener('click', ()=>{
    const text = input.value.trim();
    if(!text) return;
    tasks.push({id:nextTaskId++, topic:topicKey, text, status:'not_started', priority:sel.value, comment:'', images:[], links:[], dueDate:null, emailReminder:false});
    saveStorage(); renderOverview(); renderNav(topicKey); renderTaskList(topicKey);
  });
  input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') btn.click(); });
  el.appendChild(addRow);
}

function reorderTasks(draggedId, targetId){
  const draggedIdx = tasks.findIndex(t=>t.id===draggedId);
  if(draggedIdx === -1) return;
  const [draggedTask] = tasks.splice(draggedIdx, 1);
  const targetIdx = tasks.findIndex(t=>t.id===targetId);
  if(targetIdx === -1){ tasks.push(draggedTask); }
  else { tasks.splice(targetIdx, 0, draggedTask); }
  saveStorage();
}

function buildTaskCard(task, topicKey, draggableEnabled){
    const card = document.createElement('div');
    card.className = 'task-card';
    card.setAttribute('data-id', task.id);
    if(draggableEnabled){
      card.setAttribute('draggable', 'true');
      card.addEventListener('dragstart', (e)=>{
        draggedTaskId = task.id;
        try{ e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', String(task.id)); }catch(err){}
        card.classList.add('dragging');
      });
      card.addEventListener('dragend', ()=>{
        card.classList.remove('dragging');
        draggedTaskId = null;
        document.querySelectorAll('.drag-over').forEach(el=>el.classList.remove('drag-over'));
      });
      card.addEventListener('dragover', (e)=>{
        e.preventDefault();
        if(draggedTaskId !== null && draggedTaskId !== task.id){
          card.classList.add('drag-over');
        }
      });
      card.addEventListener('dragleave', ()=>{ card.classList.remove('drag-over'); });
      card.addEventListener('drop', (e)=>{
        e.preventDefault();
        card.classList.remove('drag-over');
        if(draggedTaskId === null || draggedTaskId === task.id) return;
        reorderTasks(draggedTaskId, task.id);
        draggedTaskId = null;
        renderOverview(); renderNav(topicKey); renderTaskList(topicKey);
      });
    }

    if(draggableEnabled){
      const handle = document.createElement('span');
      handle.className = 'drag-handle';
      handle.innerHTML = icon('dots');
      handle.title = 'Drag to reorder';
      card.appendChild(handle);
    }

    const check = document.createElement('button');
    check.className = 'task-check' + (task.status==='done'?' done':'');
    check.addEventListener('click', ()=>{
      task.status = task.status==='done' ? 'not_started' : 'done';
      saveStorage(); renderOverview(); renderNav(topicKey); renderTaskList(topicKey);
    });

    const body = document.createElement('div');
    body.className = 'task-body';

    const top = document.createElement('div');
    top.className = 'task-top';

    const text = document.createElement('span');
    text.className = 'task-text' + (task.status==='done'?' done':'');
    text.textContent = task.text;
    text.addEventListener('click', ()=>{ task._expanded = !task._expanded; renderTaskList(topicKey); });

    const pill = document.createElement('span');
    pill.className = 'pill ' + task.priority;
    pill.textContent = task.priority;

    const statusSel = document.createElement('select');
    statusSel.className = 'status-select ' + task.status;
    [['not_started','Not started'],['in_progress','In progress'],['done','Done'],['blocked','Blocked']].forEach(([v,l])=>{
      const opt = document.createElement('option');
      opt.value=v; opt.textContent=l;
      if(task.status===v) opt.selected=true;
      statusSel.appendChild(opt);
    });
    statusSel.addEventListener('change', (e)=>{
      task.status = e.target.value;
      saveStorage(); renderOverview(); renderNav(topicKey); renderTaskList(topicKey);
    });

    const imgBtn = document.createElement('button');
    imgBtn.className = 'icon-btn';
    imgBtn.title = 'Attach image';
    imgBtn.innerHTML = icon('image');
    const fileInput = document.createElement('input');
    fileInput.type = 'file'; fileInput.accept = 'image/*'; fileInput.style.display = 'none';
    fileInput.addEventListener('change', (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      fileToResizedDataUrl(file, 480, (dataUrl)=>{
        if(!task.images) task.images = [];
        task.images.push(dataUrl);
        saveStorage(); renderTaskList(topicKey);
      });
    });
    imgBtn.addEventListener('click', ()=>fileInput.click());

    const linkBtn = document.createElement('button');
    linkBtn.className = 'icon-btn';
    linkBtn.title = 'Add Google Drive link';
    linkBtn.innerHTML = icon('link');
    linkBtn.addEventListener('click', ()=>{
      const url = prompt('Paste Google Drive (or any) link:');
      if(url && url.trim()){
        if(!task.links) task.links = [];
        task.links.push(url.trim());
        saveStorage(); renderTaskList(topicKey);
      }
    });

    const calBtn = document.createElement('button');
    calBtn.className = 'icon-btn';
    calBtn.title = 'Set due date';
    calBtn.innerHTML = icon('calendar');
    calBtn.addEventListener('click', ()=>{ task._dueOpen = !task._dueOpen; renderTaskList(topicKey); });

    let dueBadge = null;
    if(task.dueDate && !task._dueOpen){
      const today = new Date().toISOString().slice(0,10);
      dueBadge = document.createElement('span');
      let cls = 'due-badge' + (task.emailReminder ? ' reminder' : '');
      if(task.dueDate < today) cls += ' overdue';
      else if(task.dueDate === today) cls += ' today';
      dueBadge.className = cls;
      dueBadge.innerHTML = (task.emailReminder ? icon('bell') : '') + '<span>'+task.dueDate+'</span>';
      dueBadge.title = task.emailReminder ? 'Email reminder set for this date' : 'Due date, no reminder';
      dueBadge.addEventListener('click', ()=>{ task._dueOpen = true; renderTaskList(topicKey); });
    }

    const del = document.createElement('button');
    del.className = 'task-del';
    del.textContent = 'Delete task';
    del.title = 'Delete this entire task';
    del.addEventListener('click', ()=>{
      if(confirm('Delete this task? This removes it and any attached images/links.')){
        snapshotBeforeChange('before deleting: '+task.text);
        tasks = tasks.filter(t=>t.id!==task.id);
        saveStorage(); renderOverview(); renderNav(topicKey); renderTaskList(topicKey);
      }
    });

    top.appendChild(check);
    top.appendChild(text);
    top.appendChild(pill);
    top.appendChild(statusSel);
    if(dueBadge) top.appendChild(dueBadge);
    top.appendChild(calBtn);
    top.appendChild(imgBtn);
    top.appendChild(fileInput);
    top.appendChild(linkBtn);
    top.appendChild(del);
    body.appendChild(top);

    if(task._dueOpen){
      const panel = document.createElement('div');
      panel.className = 'due-panel';
      const dateInput = document.createElement('input');
      dateInput.type = 'date';
      dateInput.value = task.dueDate || '';
      dateInput.addEventListener('change', (e)=>{ task.dueDate = e.target.value; saveStorage(); });
      const label = document.createElement('label');
      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = !!task.emailReminder;
      checkbox.addEventListener('change', (e)=>{ task.emailReminder = e.target.checked; saveStorage(); });
      label.appendChild(checkbox);
      label.appendChild(document.createTextNode('Email reminder on this date (optional)'));
      const doneBtn = document.createElement('button');
      doneBtn.className = 'due-remove';
      doneBtn.textContent = 'Done';
      doneBtn.style.textDecoration = 'none';
      doneBtn.addEventListener('click', ()=>{ task._dueOpen = false; renderTaskList(topicKey); });
      const removeBtn = document.createElement('button');
      removeBtn.className = 'due-remove';
      removeBtn.textContent = 'Remove due date';
      removeBtn.addEventListener('click', ()=>{ task.dueDate=null; task.emailReminder=false; task._dueOpen=false; saveStorage(); renderTaskList(topicKey); });
      panel.appendChild(dateInput);
      panel.appendChild(label);
      panel.appendChild(doneBtn);
      panel.appendChild(removeBtn);
      body.appendChild(panel);
    }

    if(task._expanded){
      const box = document.createElement('textarea');
      box.className = 'comment-input';
      box.placeholder = 'Add a comment...';
      box.value = task.comment || '';
      box.addEventListener('blur', (e)=>{ task.comment = e.target.value; saveStorage(); });
      body.appendChild(box);
    } else if(task.comment){
      const c = document.createElement('div');
      c.className = 'task-comment';
      c.textContent = task.comment;
      body.appendChild(c);
    }

    if((task.images && task.images.length) || (task.links && task.links.length)){
      const attachRow = document.createElement('div');
      attachRow.className = 'attach-row';
      (task.images||[]).forEach((src, idx)=>{
        const wrap = document.createElement('div');
        wrap.className = 'thumb-wrap';
        const thumb = document.createElement('img');
        thumb.className = 'thumb';
        thumb.src = src;
        thumb.addEventListener('click', ()=>openImageModal(src));
        const x = document.createElement('button');
        x.className = 'attach-x';
        x.innerHTML = '&times;';
        x.title = 'Remove image';
        x.addEventListener('click', (e)=>{
          e.stopPropagation();
          task.images.splice(idx,1);
          saveStorage(); renderTaskList(topicKey);
        });
        wrap.appendChild(thumb);
        wrap.appendChild(x);
        attachRow.appendChild(wrap);
      });
      (task.links||[]).forEach((url, idx)=>{
        const wrap = document.createElement('div');
        wrap.className = 'drive-chip-wrap';
        const chip = document.createElement('a');
        chip.className = 'drive-chip';
        chip.href = url;
        chip.target = '_blank';
        chip.rel = 'noopener noreferrer';
        let display = url;
        try{ display = new URL(url).hostname.replace('www.',''); }catch(e){}
        chip.innerHTML = `${icon('link')} ${display}`;
        const x = document.createElement('button');
        x.className = 'chip-x';
        x.innerHTML = '&times;';
        x.title = 'Remove link';
        x.addEventListener('click', (e)=>{
          e.preventDefault(); e.stopPropagation();
          task.links.splice(idx,1);
          saveStorage(); renderTaskList(topicKey);
        });
        wrap.appendChild(chip);
        wrap.appendChild(x);
        attachRow.appendChild(wrap);
      });
      body.appendChild(attachRow);
    }

    card.appendChild(body);
    return card;
}

document.getElementById('export-btn').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify({tasks, formulaRows}, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'virt-tracker-backup.json'; a.click();
  URL.revokeObjectURL(url);
  setLastExport();
  renderExportReminder();
});

document.getElementById('history-btn').addEventListener('click', openHistoryModal);


document.getElementById('export-ics-btn').addEventListener('click', ()=>{
  const reminderTasks = tasks.filter(t=>t.dueDate && t.emailReminder);
  if(!reminderTasks.length){
    alert('No tasks have an email reminder set yet. Click the calendar icon on a task to add one.');
    return;
  }
  const pad = n => String(n).padStart(2,'0');
  const stamp = ()=>{
    const d = new Date();
    return d.getUTCFullYear()+pad(d.getUTCMonth()+1)+pad(d.getUTCDate())+'T'+pad(d.getUTCHours())+pad(d.getUTCMinutes())+pad(d.getUTCSeconds())+'Z';
  };
  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//VIRT Ops Ledger//EN\r\n';
  reminderTasks.forEach(t=>{
    const dateStr = t.dueDate.replace(/-/g,'');
    const topicLabel = TOPICS.find(x=>x.key===t.topic).label;
    ics += 'BEGIN:VEVENT\r\n';
    ics += 'UID:'+t.id+'-'+dateStr+'@virt-ops-ledger\r\n';
    ics += 'DTSTAMP:'+stamp()+'\r\n';
    ics += 'DTSTART;VALUE=DATE:'+dateStr+'\r\n';
    ics += 'DTEND;VALUE=DATE:'+dateStr+'\r\n';
    ics += 'SUMMARY:VIRT deadline - '+t.text.replace(/[\r\n]/g,' ')+'\r\n';
    ics += 'DESCRIPTION:Topic: '+topicLabel+'\r\n';
    ics += 'BEGIN:VALARM\r\nACTION:EMAIL\r\nTRIGGER:PT0M\r\nSUMMARY:VIRT deadline today\r\nDESCRIPTION:'+t.text.replace(/[\r\n]/g,' ')+'\r\n';
    ics += 'END:VALARM\r\n';
    ics += 'END:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR\r\n';
  const blob = new Blob([ics], {type:'text/calendar'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'virt-reminders.ics'; a.click();
  URL.revokeObjectURL(url);
});
document.getElementById('import-btn').addEventListener('click', ()=>{ document.getElementById('import-file').click(); });
document.getElementById('import-file').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (evt)=>{
    try{
      const imported = JSON.parse(evt.target.result);
      if(imported.tasks){
        tasks = imported.tasks;
        formulaRows = imported.formulaRows || [];
        nextTaskId = Math.max(0, ...tasks.map(t=>t.id||0)) + 1;
        nextFormulaId = Math.max(0, ...formulaRows.map(r=>r.id||0)) + 1;
        saveStorage();
        renderOverview(); renderTopicViews(); switchView('overview');
      }
    }catch(err){ alert('Could not read that file.'); }
  };
  reader.readAsText(file);
});

(async function init(){
  const stored = await loadStorage();
  if(stored && stored.tasks && stored.tasks.length){
    tasks = stored.tasks;
    formulaRows = stored.formulaRows || [];
    customTopics = stored.customTopics || [];
  } else {
    tasks = JSON.parse(JSON.stringify(SEED_TASKS));
    formulaRows = JSON.parse(JSON.stringify(SEED_FORMULA));
    customTopics = [];
  }
  recomputeTopics();
  nextCustomTopicId = 1;
  customTopics.forEach(t=>{
    const m = /^custom(\d+)$/.exec(t.key);
    if(m) nextCustomTopicId = Math.max(nextCustomTopicId, Number(m[1])+1);
  });

  // Additive merge: add any new regulation tasks the user doesn't already have,
  // matched by fixed id, without touching or reordering existing tasks.
  const existingIds = new Set(tasks.map(t=>t.id));
  let addedAny = false;
  REGULATION_TASKS.forEach(regTask=>{
    if(!existingIds.has(regTask.id)){
      tasks.push(JSON.parse(JSON.stringify(regTask)));
      addedAny = true;
    }
  });

  nextTaskId = Math.max(0, ...tasks.map(t=>t.id||0)) + 1;
  nextFormulaId = Math.max(0, ...formulaRows.map(r=>r.id||0)) + 1;
  if(addedAny) saveStorage();
  history = await loadHistory();
  renderOverview();
  renderTopicViews();
  switchView('overview');
})();
</script>
